    - id: "q-us-va-vcdpa-001"
      text: >
        Has the organization determined whether it meets the Virginia VCDPA applicability
        thresholds based on consumer count or revenue from the sale of personal data?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the VCDPA applicability assessment documenting the consumer and
        revenue thresholds evaluated.

    - id: "q-us-va-vcdpa-002"
      text: >
        Does the organization provide a clear and accessible privacy notice that includes
        all disclosures required by the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the current privacy notice and confirm it includes all VCDPA-required elements.

    - id: "q-us-va-vcdpa-003"
      text: >
        Does the organization limit the processing of personal data to specified, explicit,
        and legitimate purposes under the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data-processing register or purpose-limitation policy for Virginia
        operations.

    - id: "q-us-va-vcdpa-004"
      text: >
        Has the organization implemented reasonable data security practices to protect
        the confidentiality, integrity, and accessibility of personal data under the
        Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security policy or controls register for Virginia operations.

    - id: "q-us-va-vcdpa-005"
      text: >
        Does the organization prohibit processing personal data in a discriminatory manner
        in violation of federal or state anti-discrimination laws, as required by the
        Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the non-discrimination policy covering personal data processing.

    - id: "q-us-va-vcdpa-006"
      text: >
        Does the organization have a documented process to respond to consumer access
        and portability requests under the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the access/portability request SOP for Virginia consumers.

    - id: "q-us-va-vcdpa-007"
      text: >
        Does the organization have a documented process to honor consumer correction
        requests under the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the correction request SOP for Virginia consumers.

    - id: "q-us-va-vcdpa-008"
      text: >
        Does the organization have a documented process to honor consumer deletion
        requests under the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the deletion request SOP for Virginia consumers.

    - id: "q-us-va-vcdpa-009"
      text: >
        Does the organization provide consumers with mechanisms to opt out of the sale
        of personal data, targeted advertising, and profiling for consequential decisions,
        as required by the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the opt-out mechanisms provided and how opt-out signals are honored.

    - id: "q-us-va-vcdpa-010"
      text: >
        Does the organization obtain consent before processing sensitive personal data,
        as required by the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent mechanism for sensitive data processing in Virginia operations.

    - id: "q-us-va-vcdpa-011"
      text: >
        Does the organization conduct data protection impact assessments for high-risk
        processing activities as required by the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the DPIA register for Virginia high-risk processing activities.

    - id: "q-us-va-vcdpa-012"
      text: >
        Has the organization executed binding data processing agreements with all
        processors that process personal data on its behalf under the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample processor agreement or a register of agreements in place.

    - id: "q-us-va-vcdpa-013"
      text: >
        Does the organization have a documented process to respond to Attorney General
        enforcement notices within the 30-day cure period under the Virginia VCDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the enforcement-response playbook or policy covering the VCDPA
        30-day cure period.

    - id: "q-us-ct-ctdpa-001"
      text: >
        Has the organization determined whether it meets the Connecticut CTDPA
        applicability thresholds based on consumer count or revenue from data processing?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the CTDPA applicability assessment documenting the thresholds evaluated.

    - id: "q-us-ct-ctdpa-002"
      text: >
        Does the organization provide a clear and accessible privacy notice that includes
        all disclosures required by the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the current privacy notice and confirm it includes all CTDPA-required elements.

    - id: "q-us-ct-ctdpa-003"
      text: >
        Does the organization apply data minimization and purpose limitation to all
        personal data processing under the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data minimization and purpose limitation policy for Connecticut operations.

    - id: "q-us-ct-ctdpa-004"
      text: >
        Has the organization implemented reasonable data security practices for personal
        data processing under the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security policy or controls register for Connecticut operations.

    - id: "q-us-ct-ctdpa-005"
      text: >
        Does the organization have a documented process to respond to consumer access
        requests within 45 days under the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the access request SOP specifying the 45-day response deadline.

    - id: "q-us-ct-ctdpa-006"
      text: >
        Does the organization have a documented process to honor consumer correction
        and deletion requests under the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the correction and deletion SOP for Connecticut consumers.

    - id: "q-us-ct-ctdpa-007"
      text: >
        Does the organization provide consumers with mechanisms to opt out of the sale
        of personal data, targeted advertising, and profiling, as required by the
        Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the opt-out mechanisms and how they are honored.

    - id: "q-us-ct-ctdpa-008"
      text: >
        Does the organization have an internal appeals process allowing consumers to
        appeal the organization's response to their rights requests under the CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the consumer rights appeal process documentation.

    - id: "q-us-ct-ctdpa-009"
      text: >
        Does the organization obtain consent before processing sensitive personal data
        under the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent mechanism for sensitive data processing in Connecticut
        operations.

    - id: "q-us-ct-ctdpa-010"
      text: >
        Does the organization conduct Data Protection Impact Assessments (DPIAs) for
        high-risk processing activities under the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the DPIA register for Connecticut high-risk processing activities.

    - id: "q-us-ct-ctdpa-011"
      text: >
        Has the organization governed all processor relationships through binding data
        processing agreements as required by the Connecticut CTDPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample processor agreement or a register of agreements in place.

    - id: "q-us-ut-ucpa-001"
      text: >
        Has the organization determined whether it meets the Utah UCPA applicability
        thresholds based on annual revenue and consumer count?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the UCPA applicability assessment documenting the revenue and consumer
        thresholds evaluated.

    - id: "q-us-ut-ucpa-002"
      text: >
        Does the organization provide a clear and accessible privacy notice that includes
        all disclosures required by the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the current privacy notice and confirm it includes all UCPA-required elements.

    - id: "q-us-ut-ucpa-003"
      text: >
        Does the organization limit processing of personal data to the purposes disclosed
        in its privacy notice and practice data minimization under the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the purpose-limitation and data-minimization policy for Utah operations.

    - id: "q-us-ut-ucpa-004"
      text: >
        Has the organization implemented reasonable administrative, technical, and physical
        security measures to protect personal data under the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security policy or controls register for Utah operations.

    - id: "q-us-ut-ucpa-005"
      text: >
        Does the organization have a documented process to respond to consumer access
        and portability requests within 45 days under the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the access/portability SOP specifying the 45-day response deadline.

    - id: "q-us-ut-ucpa-006"
      text: >
        Does the organization have a documented process to honor consumer deletion
        requests for personal data the consumer provided to the organization, as
        required by the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the deletion SOP for Utah consumers.

    - id: "q-us-ut-ucpa-007"
      text: >
        Does the organization provide consumers with mechanisms to opt out of the sale
        of personal data and targeted advertising, as required by the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the opt-out mechanisms and how they are honored for Utah consumers.

    - id: "q-us-ut-ucpa-008"
      text: >
        Does the organization obtain consent or provide opt-out mechanisms before
        processing sensitive personal data, as required by the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent or opt-out mechanism for sensitive data processing
        in Utah operations.

    - id: "q-us-ut-ucpa-009"
      text: >
        Has the organization governed all processor relationships through binding
        contracts that include the requirements of the Utah UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample processor contract or a register confirming UCPA-compliant
        terms are in place.

    - id: "q-us-ut-ucpa-010"
      text: >
        Does the organization have a documented process to respond to Utah Attorney
        General enforcement notices, given there is no private right of action under
        the UCPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the enforcement-response policy or playbook for Utah UCPA enforcement.

    - id: "q-br-lgpd-001"
      text: >
        Has the organization identified and documented a lawful basis for each personal
        data processing activity under LGPD Art. 7?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the processing register or RoPA showing the LGPD Art. 7 lawful basis
        for each processing activity.

    - id: "q-br-lgpd-002"
      text: >
        Has the organization identified and documented a lawful basis for each sensitive
        personal data processing activity under LGPD Art. 11?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the sensitive data processing register showing the Art. 11 lawful basis
        for each activity.

    - id: "q-br-lgpd-003"
      text: >
        Does the organization have a documented process to honor data subject rights
        upon request under LGPD Art. 18?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data subject rights SOP covering all Art. 18 rights.

    - id: "q-br-lgpd-004"
      text: >
        Has the organization appointed a DPO (encarregado) and published their contact
        details, as required by LGPD Art. 41?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the DPO appointment document and the URL where the DPO's contact
        details are published.

    - id: "q-br-lgpd-005"
      text: >
        Has the organization conducted a DPIA (RIPD) for high-risk personal data
        processing activities and made it available to the ANPD on request, as
        required by LGPD Art. 38?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the DPIA/RIPD register for high-risk processing activities.

    - id: "q-br-lgpd-006"
      text: >
        Has the organization ensured adequate protection before transferring personal
        data internationally, using one of the mechanisms permitted by LGPD Art. 33?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the international transfer register documenting the Art. 33 mechanism
        used for each transfer.

    - id: "q-br-lgpd-007"
      text: >
        Does the organization have a documented SOP to notify the ANPD and affected data
        subjects of security incidents that may result in risk or damage to data subjects,
        as required by LGPD Art. 48?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the incident notification SOP covering both ANPD and data subject
        notification.

    - id: "q-br-lgpd-008"
      text: >
        Does the organization maintain records of personal data processing activities
        as required by LGPD Art. 37?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the processing records register or describe the system used to maintain it.

    - id: "q-br-lgpd-009"
      text: >
        Does the organization obtain specific parental or guardian consent before
        processing children's personal data, as required by LGPD Art. 14?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the age-verification and parental consent mechanism for children's
        data processing.

    - id: "q-br-lgpd-010"
      text: >
        Does the organization ensure that operators (processors) process personal data
        only in accordance with the controller's instructions, as required by LGPD Art. 39?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample data processing agreement or a register of operator agreements
        confirming instruction-based processing.

    - id: "q-br-lgpd-011"
      text: >
        Has the organization implemented technical and administrative security measures
        to protect personal data from unauthorized access and accidental or unlawful
        situations, as required by LGPD Art. 46?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the information security policy or controls register for LGPD compliance.

    - id: "q-br-lgpd-012"
      text: >
        Does the organization apply data minimization and purpose limitation principles
        to all personal data processing, as required by LGPD Art. 6?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data minimization and purpose limitation policy for Brazil operations.

    - id: "q-br-lgpd-013"
      text: >
        Does the organization provide a transparent privacy notice to data subjects
        disclosing the information required by LGPD Art. 9?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the current privacy notice and confirm it includes all Art. 9 required
        elements.

    - id: "q-br-lgpd-014"
      text: >
        Has the organization established an accountability governance programme and
        can it demonstrate compliance with LGPD, as required by Art. 50?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the accountability governance programme document for LGPD compliance.

    - id: "q-br-lgpd-015"
      text: >
        Has the organization applied the LGPD definitions to determine the scope of
        personal data it processes and confirmed which activities fall within the
        scope of LGPD (Art. 5)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the LGPD scope assessment documenting how personal data categories
        are classified.

    - id: "q-br-lgpd-016"
      text: >
        Where the organization relies on consent as its LGPD lawful basis, is that
        consent freely given, informed, unambiguous, and specific to a purpose?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the consent mechanism and the withdrawal process.

    - id: "q-br-lgpd-017"
      text: >
        Where the organization relies on legitimate interest as its LGPD lawful basis,
        has it conducted and documented a Legitimate Interest Assessment (LIA), as
        required by Art. 10?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the LIA document for each processing activity relying on legitimate
        interest.

    - id: "q-br-lgpd-018"
      text: >
        Has the organization assessed the re-identification risk of anonymized data and
        applied LGPD anonymization standards, treating pseudonymous data as personal
        data, as required by Art. 12?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the anonymization and re-identification risk assessment.

    - id: "q-br-lgpd-019"
      text: >
        Does the organization delete or anonymize personal data when the processing
        purpose is fulfilled or the data is no longer necessary, as required by LGPD
        Art. 15?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data deletion or anonymization procedure and the retention schedule.

    - id: "q-br-lgpd-020"
      text: >
        Does the organization apply data subject rights on processing termination,
        including deleting or returning personal data, as required by LGPD Art. 16?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the processing termination procedure documenting how data is deleted
        or returned when retention is no longer justified.

    - id: "q-uk-gdpr-001"
      text: >
        Has the organization registered with the ICO and paid the applicable data
        protection fee as required by the DPA 2018 Part 4?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the ICO registration number and confirmation of current fee payment.

    - id: "q-uk-gdpr-002"
      text: >
        Does the organization have a documented SOP to report personal data breaches
        to the ICO within 72 hours of becoming aware of the breach, as required by
        UK GDPR Art. 33?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the breach notification SOP specifying the 72-hour ICO notification step.

    - id: "q-uk-gdpr-003"
      text: >
        Does the organization apply age 13 as the UK consent threshold for information
        society services and obtain parental consent for users under 13, as required by
        DPA 2018 s. 9?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the age-verification mechanism and the parental consent process
        for UK users.

    - id: "q-uk-gdpr-004"
      text: >
        Has the organization assessed whether any DPA 2018 national security or
        intelligence services exemptions apply to its processing activities, and
        applied them consistently?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the exemption analysis documenting which DPA 2018 Schedule 2
        exemptions apply to the organization's processing.

    - id: "q-uk-gdpr-005"
      text: >
        Has the organization documented the legal mechanism used for each international
        personal data transfer from the UK, such as an adequacy regulation, UK-specific
        SCCs (IDTA), or an applicable derogation?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the UK international transfer register documenting the legal mechanism
        for each transfer.

    - id: "q-uk-gdpr-006"
      text: >
        Has the organization assessed and documented its UK-EU data flows and the
        adequacy reliance basis for those flows in the post-Brexit context?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the UK-EU data flow assessment and adequacy reliance documentation.

    - id: "q-uk-gdpr-007"
      text: >
        Does the organization comply with applicable ICO statutory codes of practice
        as required by DPA 2018 ss. 121-128?
      type: boolean
      required: true
      evidence-prompt: >
        Identify the ICO codes of practice applicable to the organization and confirm
        compliance with each.

    - id: "q-uk-gdpr-008"
      text: >
        Does the organization comply with the Privacy and Electronic Communications
        Regulations (PECR 2003) for electronic marketing and cookie or tracking
        requirements?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the PECR compliance assessment and the cookie consent mechanism.

    - id: "q-uk-gdpr-009"
      text: >
        Does the organization apply the ICO Direct Marketing Code to all UK marketing
        activities?
      type: boolean
      required: true
      evidence-prompt: >
        Describe how the ICO Direct Marketing Code is applied to UK marketing
        activities.

    - id: "q-uk-gdpr-010"
      text: >
        Where the organization has no UK establishment, has it appointed a UK GDPR
        representative, as required by UK GDPR Art. 27?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the appointment document and contact details of the UK representative.

    - id: "q-us-il-bipa-001"
      text: >
        Does the organization obtain written informed consent from individuals before
        collecting their biometric identifiers or biometric information, as required
        by BIPA s. 15(b)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the written consent form used before biometric data
        collection.

    - id: "q-us-il-bipa-002"
      text: >
        Has the organization published a written biometric data retention and
        destruction schedule, as required by BIPA s. 15(a)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the published biometric data retention and destruction schedule.

    - id: "q-us-il-bipa-003"
      text: >
        Does the organization refrain from selling, leasing, trading, or otherwise
        profiting from biometric data, as required by BIPA s. 15(c)?
      type: boolean
      required: true
      evidence-prompt: >
        Confirm in writing that no commercial transactions involving biometric data
        occur, or describe the policy preventing such transactions.

    - id: "q-us-il-bipa-004"
      text: >
        Does the organization restrict the disclosure of biometric data to third
        parties and document the basis for any permitted disclosure, as required by
        BIPA s. 15(d)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the biometric data disclosure policy and any third-party disclosure
        log.

    - id: "q-us-il-bipa-005"
      text: >
        Does the organization protect biometric data using security standards at least
        as protective as those applied to other sensitive personal information, as
        required by BIPA s. 15(e)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security controls applied to biometric data storage and processing.

    - id: "q-us-il-bipa-006"
      text: >
        Has the organization applied the SB 2979 (2024) one-violation-per-subject
        interpretation to its BIPA compliance program to reflect current enforcement
        risk?
      type: boolean
      required: true
      evidence-prompt: >
        Confirm that the compliance program has been updated to reflect the SB 2979
        per-person violation rule.

    - id: "q-ca-on-phipa-001"
      text: >
        Has the organization designated a Contact Person and implemented privacy
        policies required of a Health Information Custodian (HIC) under PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the name and contact of the designated Contact Person and the
        PHIPA privacy policy.

    - id: "q-ca-on-phipa-002"
      text: >
        Does the organization ensure that all agents who handle personal health
        information (PHI) on its behalf comply with the HIC's instructions and PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the agent agreements or policies requiring PHIPA compliance.

    - id: "q-ca-on-phipa-003"
      text: >
        Does the organization obtain express consent before collecting, using, or
        disclosing personal health information, except where PHIPA expressly permits
        collection without consent?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent mechanism for PHI collection and provide a sample consent
        form.

    - id: "q-ca-on-phipa-004"
      text: >
        Does the organization respect a patient's lockbox instruction to withhold
        their PHI from specific recipients?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the lockbox implementation and how lockbox restrictions are enforced
        in the organization's systems.

    - id: "q-ca-on-phipa-005"
      text: >
        Does the organization operate within the circle of care for permitted use and
        disclosure of PHI for treatment purposes under PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe how the organization defines and manages its circle of care for PHI
        sharing.

    - id: "q-ca-on-phipa-006"
      text: >
        Does the organization limit its collection of personal health information to
        the minimum amount necessary for the identified purpose, as required by PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the data minimization process applied to PHI collection.

    - id: "q-ca-on-phipa-007"
      text: >
        Does the organization disclose personal health information only for permitted
        purposes and only to permitted recipients, as required by PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the PHI disclosure policy or the access control documentation
        governing PHI recipients.

    - id: "q-ca-on-phipa-008"
      text: >
        Has the organization implemented administrative, technical, and physical
        safeguards to protect personal health information against theft, loss, and
        unauthorized use or disclosure, as required by PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the PHI security policy or safeguards register.

    - id: "q-ca-on-phipa-009"
      text: >
        Does the organization have a documented procedure to notify affected individuals
        and the IPC of privacy breaches at the first reasonable opportunity, as required
        by PHIPA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the PHIPA breach notification SOP.

