questionnaire:
  id: "governance-privacy-officer"
  title: "Privacy Governance and Organizational Attestations"
  description: >
    Self-attestation questions for organizational privacy obligations — officer designation,
    governance frameworks, consent mechanisms, transparency notices, security programs, and
    regulatory compliance posture — that cannot be detected by static analysis or runtime metrics.
    This is the catch-all file covering controls across PIPEDA, Quebec Law 25, PIPA-AB, PIPA-BC,
    CASL, GDPR, CCPA/CPRA, EU AI Act, VCDPA, CTDPA, UCPA, LGPD, UK GDPR, BIPA, PHIPA-ON,
    and community-tier placeholder regulations.
  questions:
    - id: "q-priv-officer-designated"
      text: >
        Has the organization designated an individual accountable for compliance with
        applicable privacy legislation?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the name, title, and contact email of the designated Privacy Officer.

    - id: "q-purposes-documented"
      text: >
        Has the organization documented the purposes for which it collects personal
        information, and does it disclose those purposes at or before the time of collection?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the purpose-documentation register or the privacy notice that discloses
        purposes at or before collection.

    - id: "q-consent-mechanism-present"
      text: >
        Does the organization obtain meaningful consent before collecting, using, or
        disclosing personal information, except where law permits collection without consent?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent mechanism used, including how consent is obtained, recorded,
        and managed.

    - id: "q-collection-limited-to-purpose"
      text: >
        Does the organization limit the personal information it collects to what is
        necessary for the identified purposes?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the data-minimization review process used to assess whether each
        collection is limited to what is necessary.

    - id: "q-retention-schedule-defined"
      text: >
        Does the organization use personal information only for the stated purposes,
        and does it retain personal information only for as long as is necessary
        to fulfil those purposes?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data retention schedule or policy.

    - id: "q-security-safeguards-documented"
      text: >
        Does the organization protect personal information with security safeguards
        appropriate to the sensitivity of the information?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the information security policy or a summary of the technical and
        organizational safeguards in place.

    - id: "q-privacy-policy-published"
      text: >
        Does the organization make its privacy policies and practices readily available
        to individuals?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the URL or location where the privacy policy is published.

    - id: "q-complaint-mechanism-present"
      text: >
        Does the organization have a complaint mechanism that allows individuals to
        challenge its compliance with privacy obligations, and does it respond to and
        document complaints?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the complaint-submission process and provide a sample of how complaints
        are tracked and resolved.

    - id: "q-priv-officer-contact-published"
      text: >
        Has the organization published the contact information of the individual in charge
        of the protection of personal information?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the URL or document location where the contact information is published.

    - id: "q-governance-framework-documented"
      text: >
        Has the organization defined and documented a privacy governance framework that
        describes roles, responsibilities, and processes for managing personal information?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the governance framework document or policy that defines privacy roles
        and responsibilities.

    - id: "q-purposes-disclosed-at-collection"
      text: >
        Does the organization inform individuals of the purposes for collecting their
        personal information at or before the time of collection?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the collection notice or privacy notice used at the point
        of collection.

    - id: "q-third-party-sharing-disclosed"
      text: >
        Does the organization disclose to individuals at or before collection whether
        their personal information may be shared with third parties or used in automated
        decision-making?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the collection or privacy notice that discloses third-party sharing
        and automated decision-making practices.

    - id: "q-express-consent-for-sensitive-pi"
      text: >
        Does the organization obtain express (explicit) consent before collecting,
        using, or disclosing sensitive personal information?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the express consent mechanism used for sensitive personal information
        and provide a sample consent form or interface.

    - id: "q-granular-consent-per-purpose"
      text: >
        Does the organization obtain separate consent for each distinct purpose for which
        personal information is collected, used, or disclosed?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the granular consent architecture and provide an example showing
        per-purpose consent options.

    - id: "q-parental-consent-under-14"
      text: >
        Does the organization obtain parental or guardian consent before collecting or
        using personal information from individuals under the age of 14?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the age-verification mechanism and the parental consent process.

    - id: "q-privacy-by-default-applied"
      text: >
        Does the organization apply privacy by default to its technological products and
        services, ensuring the most privacy-protective settings are active by default?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a privacy-by-default assessment or design review showing default settings
        for each product or service.

    - id: "q-retention-destruction-schedule-exists"
      text: >
        Has the organization established and is it applying a data retention and
        destruction schedule that specifies how long personal information is kept
        and how it is securely destroyed?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the retention and destruction schedule.

    - id: "q-confidentiality-policy-published"
      text: >
        Does the organization maintain a publicly accessible, plain-language
        confidentiality policy?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the URL or location of the published confidentiality policy.

    - id: "q-collection-notice-ab"
      text: >
        Does the organization notify individuals at or before the collection of personal
        information of the purposes for collection and how to contact the organization
        with inquiries, as required by PIPA (Alberta)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the collection notice used in Alberta operations.

    - id: "q-consent-mechanism-ab"
      text: >
        Does the organization obtain consent before collecting, using, or disclosing
        personal information under PIPA (Alberta)?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent mechanism and provide a sample of how consent is obtained
        and recorded for Alberta operations.

    - id: "q-employee-pi-purposes-reasonable"
      text: >
        Does the organization limit its collection and use of employee personal information
        to purposes that a reasonable person would consider appropriate, and does it provide
        employees with notice of those purposes?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the employee privacy notice or policy that describes the purposes for
        collecting employee personal information.

    - id: "q-disclosure-without-consent-basis-documented"
      text: >
        Where the organization discloses personal information without consent under an
        authorized exception, does it document the legal basis for each such disclosure?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the disclosure-without-consent policy or log that records the legal basis
        for each disclosure made without consent.

    - id: "q-security-arrangements-ab"
      text: >
        Does the organization have reasonable security arrangements in place to protect
        personal information against loss, theft, and unauthorized access, disclosure,
        copying, use, or modification, as required by PIPA (Alberta)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security policy or a description of the administrative, technical,
        and physical safeguards protecting personal information.

    - id: "q-priv-officer-designated-ab"
      text: >
        Has the organization designated one or more individuals responsible for ensuring
        compliance with PIPA (Alberta)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the name and title of the designated privacy officer(s) for Alberta
        operations.

    - id: "q-collection-notice-bc"
      text: >
        Does the organization notify individuals at or before the collection of personal
        information of the purposes for collection and identify a contact for inquiries,
        as required by PIPA (BC)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the collection notice used in BC operations.

    - id: "q-consent-mechanism-bc"
      text: >
        Does the organization obtain consent before collecting, using, or disclosing
        personal information under PIPA (BC)?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent mechanism for BC operations and provide a sample of how
        consent is obtained and recorded.

    - id: "q-employee-pi-purposes-bc"
      text: >
        Does the organization limit collection of employee personal information to
        reasonable purposes and provide employees with notice of those purposes,
        as required by PIPA (BC)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the employee privacy notice describing the purposes for which employee
        personal information is collected in BC operations.

    - id: "q-disclosure-without-consent-bc"
      text: >
        Where the organization discloses personal information without consent under an
        authorized exception in PIPA (BC), does it document the legal basis for each
        such disclosure?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the disclosure-without-consent policy or log for BC operations.

    - id: "q-security-arrangements-bc"
      text: >
        Does the organization have reasonable security arrangements to protect personal
        information from unauthorized access, collection, use, disclosure, or disposal,
        as required by PIPA (BC)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security policy or a summary of safeguards protecting personal
        information in BC operations.

    - id: "q-priv-officer-designated-bc"
      text: >
        Has the organization designated one or more individuals responsible for ensuring
        compliance with PIPA (BC)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the name and title of the designated privacy officer(s) for BC operations.

    - id: "q-privacy-practices-records-bc"
      text: >
        Does the organization develop and follow privacy policies and practices, and
        make them available to individuals on request, as required by PIPA (BC)?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the privacy policies and describe the process for making them available
        to individuals on request.

    - id: "q-cem-consent-obtained"
      text: >
        Does the organization obtain express or valid implied consent from recipients
        before sending commercial electronic messages (CEMs)?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent process for CEM sending, including how consent records are
        maintained.

    - id: "q-cem-sender-identified"
      text: >
        Does the organization clearly identify itself as the sender in every commercial
        electronic message it sends?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample CEM showing the sender identification, including name, mailing
        address, and contact information.

    - id: "q-transmission-data-not-altered"
      text: >
        Does the organization refrain from altering transmission data in electronic
        messages without the express consent of the originator?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the technical controls and policies in place to prevent alteration of
        electronic message transmission data.

    - id: "q-software-install-consent-obtained"
      text: >
        Does the organization obtain express consent before installing software on
        a user's computer system, and does it disclose the function of the software?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the consent mechanism for software installation and a sample of the
        disclosure provided to users.

    - id: "q-consent-records-retained"
      text: >
        Does the organization retain proof of each consent obtained for sending CEMs,
        including a copy of the consent request itself?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the consent-record retention system and the retention period for
        consent records.

    - id: "q-casl-published-address-relevance-documented"
      text: >
        Where the organization relies on the business-card implied-consent exception
        (CASL s. 10(9)), has it documented that the CEM sent is relevant to the
        recipient's business role in which the address was published?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the policy or documented determination confirming relevance of the
        CEM to the recipient's published business role.

    - id: "q-lawful-basis-documented"
      text: >
        Has the organization identified and documented a lawful basis for each
        personal data processing activity under GDPR Art. 6?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the Record of Processing Activities (RoPA) or processing register
        showing the lawful basis for each activity.

    - id: "q-purpose-limitation-documented"
      text: >
        Does the organization collect personal data only for specified, explicit,
        and legitimate purposes, and does it refrain from further processing in
        a manner incompatible with those purposes?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the purpose-limitation policy or the RoPA entries documenting the
        specified purposes for each processing activity.

    - id: "q-data-minimisation-applied"
      text: >
        Does the organization apply data minimisation, accuracy, storage limitation,
        and integrity and confidentiality principles to all personal data processing?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data-governance policy that addresses minimisation, accuracy,
        retention limits, and security.

    - id: "q-consent-conditions-met"
      text: >
        Where the organization relies on consent as its lawful basis for processing,
        is that consent freely given, specific, informed, unambiguous, and as easy
        to withdraw as to give?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the consent mechanism and the withdrawal mechanism,
        confirming equal ease of withdrawal.

    - id: "q-special-category-conditions-met"
      text: >
        Where the organization processes special category data (GDPR Art. 9), has it
        identified and documented a qualifying condition, and does it apply age-appropriate
        parental consent for children's data?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the special-category processing register with the Art. 9 condition
        documented for each processing activity.

    - id: "q-transparency-notices-present"
      text: >
        Does the organization provide privacy notices at collection and on request
        that contain all required GDPR transparency information?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the current privacy notice and confirm it includes all Art. 13/14
        required elements.

    - id: "q-ropa-maintained"
      text: >
        Does the organization maintain a Record of Processing Activities (RoPA) as
        required by GDPR Art. 30?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the RoPA document or confirm the system used to maintain it.

    - id: "q-privacy-by-design-applied"
      text: >
        Does the organization embed data protection by design and by default into
        its systems and processes from the earliest stage of development?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a privacy-by-design assessment or design review for a recent system
        or product.

    - id: "q-security-toms-implemented"
      text: >
        Has the organization implemented appropriate technical and organisational
        measures (TOMs) to ensure a level of security appropriate to the risk of
        personal data processing?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the information security policy or a security controls register
        documenting the TOMs implemented.

    - id: "q-dpo-designated-where-required"
      text: >
        Where required by GDPR Art. 37, has the organization designated a Data
        Protection Officer (DPO), published the DPO's contact details, and notified
        the relevant supervisory authority?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the DPO designation document, the published DPO contact URL, and
        confirmation of notification to the supervisory authority.

    - id: "q-controller-accountability-mapping"
      text: >
        Has the organization implemented appropriate technical and organisational
        measures to ensure and demonstrate that its personal data processing complies
        with GDPR, as required by Art. 24?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the accountability framework or compliance programme document showing
        how GDPR compliance is implemented and evidenced.

    - id: "q-eu-representative-designated"
      text: >
        Where the organization processes personal data of EU data subjects without an
        EU establishment, has it designated a representative in the EU in writing,
        as required by GDPR Art. 27?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the written designation document and the name and contact details of
        the EU representative.

    - id: "q-supervisory-authority-cooperation-sop"
      text: >
        Does the organization have a documented procedure for cooperating with
        supervisory authority requests, including providing access and information
        as required by GDPR Art. 31?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the supervisory authority cooperation SOP or the section of the
        compliance programme that covers Art. 31 obligations.

    - id: "q-non-discrimination-policy"
      text: >
        Does the organization have a policy prohibiting discrimination against
        consumers who exercise their rights under CCPA/CPRA?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the non-discrimination policy or the section of the privacy policy
        that addresses CCPA/CPRA non-discrimination obligations.

    - id: "q-notice-at-collection-ccpa"
      text: >
        Does the organization provide consumers with a notice at or before the point
        of collection disclosing the categories of personal information collected,
        the purposes, and the retention period?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the notice at collection used.

    - id: "q-privacy-policy-annual-update"
      text: >
        Does the organization maintain a comprehensive privacy policy that includes
        all CCPA/CPRA-required disclosures and is updated at least every 12 months?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the current privacy policy and the date it was last updated.

    - id: "q-reasonable-security-ccpa"
      text: >
        Does the organization implement and maintain reasonable security procedures
        and practices appropriate to the nature of the personal information it holds?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the security policy or a description of the security controls
        protecting personal information.

    - id: "q-ccpa-exemption-basis-documented"
      text: >
        Has the organization identified and documented the CCPA/CPRA exemptions
        that apply to its operations, and does it apply those exemptions consistently?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the exemption analysis or legal memo documenting which CCPA/CPRA
        exemptions the organization relies on.

    - id: "q-ccpa-enforcement-response-playbook"
      text: >
        Does the organization have a documented playbook for responding to CPPA
        enforcement actions, including the cure period compliance process?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the enforcement-response playbook or the section of the compliance
        programme that addresses CPPA enforcement.

    - id: "q-ccpa-pra-security-program-documented"
      text: >
        Does the organization have a documented data security program that addresses
        the private right of action for data security breaches under CCPA/CPRA
        s. 1798.199.95?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data security programme document and describe how it addresses
        the private right of action liability exposure.

    - id: "q-eu-ai-act-001"
      text: >
        Has the organization established and does it maintain a risk management system
        for each high-risk AI system it places on the market or puts into service,
        as required by EU AI Act Art. 9?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the risk management system documentation for each high-risk AI system.

    - id: "q-eu-ai-act-002"
      text: >
        Has the organization implemented data governance practices covering training,
        validation, and testing datasets for high-risk AI systems, as required by
        EU AI Act Art. 10?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the data governance policy or procedures for AI training datasets.

    - id: "q-eu-ai-act-003"
      text: >
        Has the organization prepared and does it maintain Annex IV technical
        documentation before placing each high-risk AI system on the market or
        putting it into service?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the Annex IV technical documentation for each high-risk AI system.

    - id: "q-eu-ai-act-004"
      text: >
        Has the organization ensured that each high-risk AI system automatically
        logs events throughout its lifecycle to the extent enabled by the system?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the logging specification or configuration confirming automated logging
        is enabled for each high-risk AI system.

    - id: "q-eu-ai-act-005"
      text: >
        Does the organization provide deployers of its high-risk AI systems with
        transparent information and instructions for use, as required by EU AI Act Art. 13?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the instructions-for-use documentation provided to deployers.

    - id: "q-eu-ai-act-006"
      text: >
        Has the organization designed its high-risk AI systems with effective human
        oversight measures, as required by EU AI Act Art. 14?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the human oversight design documentation for each high-risk AI system.

    - id: "q-eu-ai-act-007"
      text: >
        Has the organization achieved and does it maintain appropriate levels of
        accuracy, robustness, and cybersecurity for its high-risk AI systems,
        as required by EU AI Act Art. 15?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the accuracy, robustness, and cybersecurity assessment for each
        high-risk AI system.

    - id: "q-eu-ai-act-008"
      text: >
        Does the organization comply with high-risk AI obligations when deploying
        AI systems in employment and worker management contexts, as required by
        EU AI Act Annex III §4?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the employment AI compliance assessment for each system used in
        employment or worker management contexts.

    - id: "q-eu-ai-act-009"
      text: >
        Has the organization fulfilled its deployer obligations for high-risk AI
        systems, including post-market monitoring and human oversight, as required
        by EU AI Act Art. 26?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the deployer obligations checklist or compliance record for each
        high-risk AI system deployed.

    - id: "q-eu-ai-act-010"
      text: >
        Has the organization conducted a fundamental rights impact assessment before
        deploying a high-risk AI system in a public or regulated context, as required
        by EU AI Act Art. 27?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the fundamental rights impact assessment for each qualifying deployment.

    - id: "q-eu-ai-act-011"
      text: >
        Does the organization notify natural persons when they are interacting with
        an AI system, and does it disclose AI-generated content as required by
        EU AI Act Art. 50?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a sample of the AI interaction notice and describe the AI-generated
        content disclosure mechanism.

    - id: "q-eu-ai-act-012"
      text: >
        Does the organization label deepfake and synthetic media content with
        machine-readable disclosure, as required by EU AI Act Art. 50?
      type: boolean
      required: true
      evidence-prompt: >
        Describe the technical mechanism used to embed machine-readable disclosures
        in deepfake or synthetic content.

    - id: "q-eu-ai-act-013"
      text: >
        Has the organization confirmed that it does not develop or deploy AI systems
        that engage in prohibited practices under EU AI Act Art. 5?
      type: boolean
      required: true
      evidence-prompt: >
        Provide a documented assessment confirming no prohibited AI practices are
        present in the organization's systems.

    - id: "q-eu-ai-act-014"
      text: >
        Has the organization completed the required conformity assessment and registered
        each high-risk AI system in the EU database before placing it on the market?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the conformity assessment documentation and the EU database registration
        reference for each high-risk AI system.

    - id: "q-eu-ai-act-015"
      text: >
        Has the organization drawn up and does it maintain an EU declaration of
        conformity for each high-risk AI system?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the EU declaration of conformity for each high-risk AI system.

    - id: "q-eu-ai-act-016"
      text: >
        Has the organization established a post-market monitoring system for its
        high-risk AI systems and does it report serious incidents to the relevant
        national authority?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the post-market monitoring plan and the incident reporting SOP for
        high-risk AI systems.

    - id: "q-eu-ai-act-017"
      text: >
        Where the organization is a GPAI model provider, has it prepared and maintained
        technical documentation, a training data summary, and a copyright compliance
        policy, as required by EU AI Act Art. 53?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the GPAI technical documentation, the training data summary, and
        the copyright policy for each GPAI model.

    - id: "q-eu-ai-act-018"
      text: >
        Where the organization provides a GPAI model with systemic risk, has it conducted
        model evaluations, adversarial testing, implemented incident reporting, and
        addressed cybersecurity risks, as required by EU AI Act Art. 55?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the systemic-risk model evaluation report, adversarial testing results,
        and incident reporting SOP.

    - id: "q-eu-ai-act-019"
      text: >
        Where the organization is a non-EU GPAI model provider placing models on the EU
        market, has it designated a Union-based authorised representative, as required
        by EU AI Act Art. 54?
      type: boolean
      required: false
      evidence-prompt: >
        Provide the written designation of the authorised representative and their
        contact details.

    - id: "q-eu-ai-act-020"
      text: >
        Has the organization completed a documented assessment to determine whether any
        of its AI systems fall within the Annex III §1 biometric identification and
        categorisation category of high-risk AI systems?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the Annex III §1 scope assessment document for each AI system evaluated.

    - id: "q-eu-ai-act-021"
      text: >
        Has the organization completed a documented assessment to determine whether any
        of its AI systems fall within the Annex III §2 critical infrastructure management
        category of high-risk AI systems?
      type: boolean
      required: true
      evidence-prompt: >
        Provide the Annex III §2 scope assessment document for each AI system evaluated.

    - id: "q-eu-ai-act-022"
      text: >
