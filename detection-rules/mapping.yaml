# Control-to-Detection-Rule Join Schema
# This file is the authoritative index mapping OSCAL control IDs to detection rule files.
# Methods: semgrep | otel | questionnaire.
# Schema version: 0.1.0
#
# RULE-ID NAMING CONVENTION (C-M17 fix 2026-05-10):
# Semgrep rule files contain per-language rule IDs (e.g., missing-audit-python,
# missing-audit-javascript, missing-audit-java, missing-audit-csharp). The `rule-id`
# field in this mapping references the Python rule-id as the canonical identifier
# (Python is the primary production-supported language). The semgrep CLI join is done
# against the full rule file — language-specific rule-ids are needed because semgrep
# requires unique IDs within a rule set. Do not use the family name (e.g., "missing-audit")
# as a rule-id — it does not match any actual rule and breaks the runtime join.
#
# NOTE: questionnaire/* and otel-queries/* file references in this index are
# Phase 2 / Phase 5 deliverables. Rule files for these methods will be authored
# in those phases (see detection-rules/questionnaire/README.md). Until then,
# QuestionnaireEngine handles missing fragments via its mapping-driven fallback,
# and OtelEngine v0 is a stub. Semgrep file references (5 files under
# detection-rules/semgrep/) all resolve on disk today.
schema-version: "0.1.0"

