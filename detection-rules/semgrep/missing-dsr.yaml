rules:
  - id: missing-dsr-python
    languages: [python]
    severity: INFO
    message: |
      Sensitive delete or export operation detected without an accompanying DSR (data-subject
      request) endpoint heuristic. Privacy laws (GDPR Art. 15-17, PIPEDA Principle 9, CCPA,
      Quebec Law 25 s.27) require a documented mechanism for users to request access, erasure,
      correction, or portability of their personal data. Ensure your FastAPI/Flask/Django app
      exposes at least one route matching /dsr, /data-rights, /users/me/data, or
      /users/{id}/delete, or that a dedicated DSR handler class exists.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-15-right-of-access/"
        - "https://gdpr.eu/article-17-right-to-be-forgotten/"
        - "https://www.priv.gc.ca/en/privacy-topics/privacy-laws-in-canada/the-personal-information-protection-and-electronic-documents-act-pipeda/"
      controls:
        - "EU-GDPR-007"
        - "EU-GDPR-008"
        - "CA-PIPEDA-009"
        - "CA-QC-LAW25-017"
        - "US-CA-CCPA-001"
        - "US-CA-CCPA-002"
        - "CA-AB-PIPA-005"
        - "CA-BC-PIPA-005"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x rewrite. The deletion patterns no longer match a bare `.delete()`; the
        single-argument repository form requires a user-ish argument and the zero-argument
        form requires a user-ish receiver, so cache/session evictions like `cache.delete(key)`
        are not flagged. Raw `DELETE FROM <user table>` SQL passed to a cursor is also
        detected. Suppression is limited to deletions inside a class whose name looks like a
        DSR handler (dsr/datasubject/datarights/privacy/erasure/gdpr). v0 heuristic — file-level
        scope, not per-app; it cannot see a DSR route defined in another module. The
        questionnaire fallback covers controls this heuristic misses.
    patterns:
      - pattern-either:
          # Zero-argument delete on a user-ish receiver (Django model / queryset).
          - patterns:
              - pattern: $USER.delete()
              - metavariable-regex:
                  metavariable: $USER
                  regex: (?i).*(user|account|member|customer|profile)
          # Repository/session delete whose argument is a user-ish value.
          - patterns:
              - pattern: $REPO.delete($ARG)
              - metavariable-regex:
                  metavariable: $ARG
                  regex: (?i).*(user|account|member|customer|profile)
          # Raw-SQL user deletion via a DB cursor.
          - patterns:
              - pattern: $CUR.execute($SQL, ...)
              - metavariable-regex:
                  metavariable: $SQL
                  regex: (?i)['"]?\s*delete\s+from\s+['"]?\s*\w*user
      - pattern-not-inside:
          patterns:
            - pattern: |
                class $DSR:
                    ...
            - metavariable-regex:
                metavariable: $DSR
                regex: (?i).*(dsr|datasubject|datarights|privacy|erasure|gdpr)

  - id: missing-dsr-javascript
    languages: [javascript, typescript]
    severity: INFO
    message: |
      Sensitive delete operation detected without a visible DSR endpoint or handler. Privacy laws
      (GDPR Art. 15-17, PIPEDA, CCPA, Quebec Law 25) require a mechanism for users to request
      access, erasure, correction, or portability. Ensure your Express/NestJS/Fastify app exposes
      a route matching /dsr, /data-rights, /users/:id/data, or /users/:id/delete.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-15-right-of-access/"
        - "https://gdpr.eu/article-17-right-to-be-forgotten/"
      controls:
        - "EU-GDPR-007"
        - "EU-GDPR-008"
        - "CA-PIPEDA-009"
        - "CA-QC-LAW25-017"
        - "US-CA-CCPA-001"
        - "US-CA-CCPA-002"
        - "CA-AB-PIPA-005"
        - "CA-BC-PIPA-005"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x rewrite. The deletion patterns require either a user-ish ORM/repository
        receiver or a `DELETE FROM <user table>` SQL string argument, so unrelated `.delete()`
        calls on cookies, Map/Set, IndexedDB object stores, the Cache API and HTTP Headers are
        not flagged. Suppressed inside a DSR-named handler class or an Express `/dsr`
        /`/data-rights` route. Known limitation: a receiver whose name contains a user-ish
        token but is not a data store (e.g. `userCache`) can still false-positive — inherent
        to name-based heuristics. v0 heuristic — file-level scope; the questionnaire fallback
        covers controls this heuristic misses.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $REPO.$DEL(...)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
              - metavariable-regex:
                  metavariable: $DEL
                  regex: ^(delete|deleteById|deleteOne|deleteMany|remove|destroy|softDelete)$
          # $FN constrained to DB-execution method names so a log line or comment
          # string that merely contains "delete from user" text is not flagged.
          - patterns:
              - pattern: $FN($SQL, ...)
              - metavariable-regex:
                  metavariable: $FN
                  regex: (?i).*(query|exec|raw)
              - metavariable-regex:
                  metavariable: $SQL
                  regex: (?i)['"`]?\s*delete\s+from\s+['"`]?\s*\w*user
      - pattern-not-inside:
          patterns:
            - pattern: class $DSR { ... }
            - metavariable-regex:
                metavariable: $DSR
                regex: (?i).*(dsr|datasubject|datarights|privacy|erasure|gdpr)
      - pattern-not-inside: $APP.delete("/dsr", ...)
      - pattern-not-inside: $APP.delete("/data-rights", ...)

  - id: missing-dsr-java
    languages: [java]
    severity: INFO
    message: |
      Repository delete call detected without a visible DSR controller or handler. Ensure your
      Spring/Jakarta application exposes a DSR endpoint (e.g., DELETE /users/{id} with identity
      verification, or a dedicated DsrController). Baseline rule — review manually.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-17-right-to-be-forgotten/"
      controls:
        - "EU-GDPR-007"
        - "EU-GDPR-008"
        - "CA-PIPEDA-009"
        - "CA-QC-LAW25-017"
        - "US-CA-CCPA-001"
        - "US-CA-CCPA-002"
        - "CA-AB-PIPA-005"
        - "CA-BC-PIPA-005"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x fix. The delete receiver is constrained to a user-ish name so generic
        `List`/`Map` `.delete()` calls are not flagged, and the suppressor class name is
        constrained to a DSR-like identifier. Baseline rule — review manually.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $REPO.delete($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - patterns:
              - pattern: $REPO.deleteById(...)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
      - pattern-not-inside:
          patterns:
            - pattern: class $DSR { ... }
            - metavariable-regex:
                metavariable: $DSR
                regex: (?i).*(dsr|datasubject|datarights|privacy|erasure|gdpr)

  - id: missing-dsr-csharp
    languages: [csharp]
    severity: INFO
    message: |
      Repository delete call detected without a visible DSR controller or handler. Ensure your
      ASP.NET application exposes a DSR endpoint or a DsrController handling data-subject requests
      for access, erasure, and correction. Baseline rule — review manually.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-17-right-to-be-forgotten/"
      controls:
        - "EU-GDPR-007"
        - "EU-GDPR-008"
        - "CA-PIPEDA-009"
        - "CA-QC-LAW25-017"
        - "US-CA-CCPA-001"
        - "US-CA-CCPA-002"
        - "CA-AB-PIPA-005"
        - "CA-BC-PIPA-005"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x fix. The `.Remove()`/`.Delete()` receiver is constrained to a user-ish name so
        generic `List`/`ICollection` calls are not flagged, and the suppressor class name is
        constrained to a DSR-like identifier. Baseline rule — review manually.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $REPO.Remove($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - pattern: $CTX.Users.Remove($USER)
          - patterns:
              - pattern: $REPO.Delete($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - patterns:
              - pattern: await $REPO.DeleteAsync($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
      - pattern-not-inside:
          patterns:
            - pattern: class $DSR { ... }
            - metavariable-regex:
                metavariable: $DSR
                regex: (?i).*(dsr|datasubject|datarights|privacy|erasure|gdpr)
