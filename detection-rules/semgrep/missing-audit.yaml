rules:
  - id: missing-audit-python
    languages: [python]
    severity: WARNING
    message: |
      Sensitive operation (user delete, role assignment, or payment refund) performed without a
      visible audit log write. Log the actor, target, operation, and timestamp to a tamper-resistant
      audit store before performing the action. Absence of audit trails may violate PIPEDA Principle
      1, GDPR Art. 30 (RoPA), CASL consent records, and Quebec Law 25 governance requirements.
    metadata:
      category: "compliance"
      references:
        - "https://www.priv.gc.ca/en/privacy-topics/privacy-laws-in-canada/the-personal-information-protection-and-electronic-documents-act-pipeda/"
        - "https://gdpr.eu/article-30-records-of-processing-activities/"
      controls:
        - "CA-PIPEDA-001"
        - "CA-QC-LAW25-001"
        - "EU-GDPR-011"
        - "US-CA-CCPA-008"
        - "CA-CASL-006"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        pattern-not-inside suppresses when the containing function has an audit_log.write or
        audit.record call appearing before the sensitive operation. If the audit call appears
        after the delete (post-hoc logging), the rule will still fire. Considered intentional
        for v0: pre-action audit logging is the safer pattern. v1 should use taint-mode or
        a dataflow analysis to handle both orderings.
        Known FP modes: (1) functions decorated with @audit_required or similar decorators
        that inject audit logging externally; (2) calls inside try/except blocks where the
        audit write is in the except handler; (3) methods on audited model classes that log
        via ORM signals/hooks. These are suppressed where structurally detectable (see
        pattern-not-inside blocks below) but may still fire in complex decorator chains.
    patterns:
      - pattern-either:
          - pattern: $USER.delete()
          - pattern: $X.assign_role(...)
          - pattern: $X.revoke_role(...)
          - pattern: $X.refund(...)
          - pattern: $X.process_payment(...)
      - pattern-not-inside: |
          def $F(...):
              ...
              audit_log.write(...)
              ...
              $USER.delete()
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              audit.record(...)
              ...
              $USER.delete()
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              audit_logger.log(...)
              ...
              $USER.delete()
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              audit.log(...)
              ...
              $USER.delete()
              ...
      # A-H9: suppress when function is decorated with an audit decorator
      - pattern-not-inside: |
          @$AUDIT_DECORATOR
          def $F(...):
              ...
      # A-H9: suppress when sensitive operation is inside a try block that has audit in except
      - pattern-not-inside: |
          try:
              ...
          except ...:
              ...
              audit_log.write(...)
              ...

  - id: missing-audit-javascript
    languages: [javascript, typescript]
    severity: WARNING
    message: |
      Sensitive operation (user delete, role assignment, or payment refund) performed without a
      visible audit log write. Log the actor, target, operation, and timestamp to a tamper-resistant
      audit store before performing the action. Absence of audit trails may violate PIPEDA, GDPR
      Art. 30, CASL, and Quebec Law 25.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-30-records-of-processing-activities/"
      controls:
        - "CA-PIPEDA-001"
        - "CA-QC-LAW25-001"
        - "EU-GDPR-011"
        - "US-CA-CCPA-008"
        - "CA-CASL-006"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x rewrite. The deletion patterns no longer match a bare `.delete()`; they
        require either a user-ish receiver (metavariable-regex on the receiver expression)
        or a `DELETE FROM <user-table>` SQL string argument. This deliberately excludes
        unrelated `.delete()` calls on cookies, Map/Set, IndexedDB object stores, the Cache
        API and HTTP Headers. Suppression is function-scoped (function declarations, arrow
        functions and class methods) and order-independent within that scope. Known
        limitations: (1) a deletion in a helper that is audited by its *caller* will still
        fire; (2) audit calls under names other than auditLog.write / auditLogger.log /
        audit.record / audit.log are not recognised; (3) a receiver whose name contains a
        user-ish token but is not a data store (e.g. `userCache`) can still false-positive —
        inherent to name-based heuristics, so baseline-tier findings need manual review.
        v1 should use taint/dataflow analysis.
    patterns:
      - pattern-either:
          # User-record deletion via an ORM/repository with a user-ish receiver.
          - patterns:
              - pattern: $REPO.$DEL(...)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
              - metavariable-regex:
                  metavariable: $DEL
                  regex: ^(delete|deleteById|deleteOne|deleteMany|remove|destroy|softDelete)$
          # Raw-SQL user deletion (e.g. queryWithTenantContext('DELETE FROM users ...')).
          # $FN is constrained to DB-execution method names so a log line or comment
          # string that merely contains "delete from user" text is not flagged.
          - patterns:
              - pattern: $FN($SQL, ...)
              - metavariable-regex:
                  metavariable: $FN
                  regex: (?i).*(query|exec|raw)
              - metavariable-regex:
                  metavariable: $SQL
                  regex: (?i)['"`]?\s*delete\s+from\s+['"`]?\s*\w*user
          # Role / payment operations (name-based, already specific).
          - pattern: $X.assignRole(...)
          - pattern: $X.revokeRole(...)
          - pattern: $X.refund(...)
          - pattern: $X.processPayment(...)
      - pattern-not-inside: |
          function $F(...) { ... auditLog.write(...); ... }
      - pattern-not-inside: |
          function $F(...) { ... auditLogger.log(...); ... }
      - pattern-not-inside: |
          function $F(...) { ... audit.record(...); ... }
      - pattern-not-inside: |
          function $F(...) { ... audit.log(...); ... }
      - pattern-not-inside: |
          (...) => { ... auditLog.write(...); ... }
      - pattern-not-inside: |
          (...) => { ... auditLogger.log(...); ... }
      - pattern-not-inside: |
          (...) => { ... audit.record(...); ... }
      - pattern-not-inside: |
          (...) => { ... audit.log(...); ... }
      - pattern-not-inside: |
          $M(...) { ... auditLog.write(...); ... }
      - pattern-not-inside: |
          $M(...) { ... auditLogger.log(...); ... }
      - pattern-not-inside: |
          $M(...) { ... audit.record(...); ... }
      - pattern-not-inside: |
          $M(...) { ... audit.log(...); ... }

  - id: missing-audit-java
    languages: [java]
    severity: WARNING
    message: |
      Repository delete call or role-change detected without an adjacent auditLogger call. Ensure
      the actor, target, and operation are written to an audit store before or after the sensitive
      mutation. Baseline rule — review manually.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-30-records-of-processing-activities/"
      controls:
        - "CA-PIPEDA-001"
        - "CA-QC-LAW25-001"
        - "EU-GDPR-011"
        - "US-CA-CCPA-008"
        - "CA-CASL-006"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x fix. The previous suppressors (`$AUDIT.log(...)` followed by `...`) were not
        valid Java and caused semgrep to abort the whole file with a rule-parse error. They
        are replaced with method-scoped suppressors. The delete receiver is constrained to a
        user-ish name so generic `List`/`Map` `.delete()` calls are not flagged.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $REPO.delete($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - patterns:
              - pattern: $REPO.deleteById(...)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - pattern: $SERVICE.assignRole(...)
          - pattern: $SERVICE.revokeRole(...)
      - pattern-not-inside: |
          $RT $M(...) { ... auditLogger.log(...); ... }
      - pattern-not-inside: |
          $RT $M(...) { ... auditLog.write(...); ... }

  - id: missing-audit-csharp
    languages: [csharp]
    severity: WARNING
    message: |
      Repository delete call or role assignment detected without a visible audit log write. Ensure
      the actor, target, and operation are recorded in an audit trail before or after the sensitive
      operation. Baseline rule — review manually.
    metadata:
      category: "compliance"
      references:
        - "https://gdpr.eu/article-30-records-of-processing-activities/"
      controls:
        - "CA-PIPEDA-001"
        - "CA-QC-LAW25-001"
        - "EU-GDPR-011"
        - "US-CA-CCPA-008"
        - "CA-CASL-006"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
      notes: >
        v0.2.x fix. The previous suppressors (`$AUDIT.Log(...)` followed by `...`) were not
        valid C# and caused semgrep to abort the whole file with a rule-parse error. They are
        replaced with method-scoped suppressors. The `.Remove()` receiver is constrained to a
        user-ish name so generic `List`/`ICollection` `.Remove()` calls are not flagged.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $REPO.Remove($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - pattern: $CTX.Users.Remove($USER)
          - patterns:
              - pattern: await $REPO.DeleteAsync($USER)
              - metavariable-regex:
                  metavariable: $REPO
                  regex: (?i).*(user|account|member|customer|profile)
          - pattern: $SERVICE.AssignRole(...)
          - pattern: $SERVICE.RevokeRole(...)
      - pattern-not-inside: |
          $RT $M(...) { ... $AUDIT.LogInformation(...); ... }
      - pattern-not-inside: |
          $RT $M(...) { ... $AUDIT.LogAsync(...); ... }
