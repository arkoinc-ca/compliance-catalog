rules:
  - id: pii-in-logs-python
    languages: [python]
    severity: WARNING
    message: |
      Potential PII in a log statement. A field named 'email', 'phone', 'ssn', 'password',
      'token', or 'credit_card' reaches a log call — directly, via string concatenation, or
      inside an f-string. Log streams often have wider read-access than the source data store.
      Redact or mask these fields before logging.
    metadata:
      category: "compliance"
      cwe: "CWE-532"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insertion_of_Sensitive_Information_into_Log_File"
      controls:
        - "CA-PIPEDA-007"
        - "EU-GDPR-014"
        - "CA-QC-LAW25-016"
        - "US-CA-CCPA-011"
        - "CA-AB-PIPA-006"
        - "CA-BC-PIPA-006"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
    # The deep-expression operator <... e ...> matches the sensitive field
    # access anywhere inside an argument — direct, inside a string concat, or
    # inside an f-string substitution. metavariable-regex anchors the field
    # name so 'token_endpoint'/'email_provider' do not false-positive.
    patterns:
      - pattern-either:
          - pattern: logger.$LEVEL(..., <... $OBJ.$FIELD ...>, ...)
          - pattern: logging.$LEVEL(..., <... $OBJ.$FIELD ...>, ...)
          - pattern: log.$LEVEL(..., <... $OBJ.$FIELD ...>, ...)
          - pattern: print(..., <... $OBJ.$FIELD ...>, ...)
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^(email|phone|ssn|password|token|credit_card)$

  - id: pii-in-logs-javascript
    languages: [javascript, typescript]
    severity: WARNING
    message: |
      Potential PII in a log statement. A property named 'email', 'phone', 'ssn', 'password',
      'token', or 'creditCard' reaches a log call — directly, via string concatenation, or
      inside a template literal. Redact or mask these fields before logging. Consider a
      structured logging library with a built-in redaction filter.
    metadata:
      category: "compliance"
      cwe: "CWE-532"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insertion_of_Sensitive_Information_into_Log_File"
      controls:
        - "CA-PIPEDA-007"
        - "EU-GDPR-014"
        - "CA-QC-LAW25-016"
        - "US-CA-CCPA-011"
        - "CA-AB-PIPA-006"
        - "CA-BC-PIPA-006"
      # baseline confidence — pending H-12 precision corpus
      confidence: "baseline"
    # The deep-expression operator <... e ...> matches the sensitive property
    # access anywhere inside an argument — direct, inside a string concat, or
    # inside a template-literal substitution. metavariable-regex anchors the
    # property name so 'tokenEndpoint'/'emailProvider' do not false-positive.
    patterns:
      - pattern-either:
          - pattern: console.$LEVEL(..., <... $OBJ.$FIELD ...>, ...)
          - pattern: logger.$LEVEL(..., <... $OBJ.$FIELD ...>, ...)
          - pattern: log.$LEVEL(..., <... $OBJ.$FIELD ...>, ...)
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^(email|phone|ssn|password|token|creditCard|credit_card)$

  - id: pii-in-logs-java
    languages: [java]
    severity: WARNING
    message: |
      Potential PII in log statement. Logging return values of getEmail(), getPhone(), getSsn(),
      or getPassword() may leak personal information into log streams. Redact before logging.
    metadata:
      category: "compliance"
      cwe: "CWE-532"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insertion_of_Sensitive_Information_into_Log_File"
      controls:
        - "CA-PIPEDA-007"
        - "EU-GDPR-014"
        - "CA-QC-LAW25-016"
        - "US-CA-CCPA-011"
        - "CA-AB-PIPA-006"
        - "CA-BC-PIPA-006"
      confidence: "baseline"
    pattern-either:
      - pattern: $LOGGER.info($X.getEmail())
      - pattern: $LOGGER.info($X.getPhone())
      - pattern: $LOGGER.info($X.getSsn())
      - pattern: $LOGGER.info($X.getPassword())
      - pattern: $LOGGER.debug($X.getEmail())
      - pattern: $LOGGER.debug($X.getPhone())
      - pattern: $LOGGER.debug($X.getSsn())
      - pattern: $LOGGER.debug($X.getPassword())
      - pattern: $LOGGER.warn($X.getEmail())
      - pattern: $LOGGER.warn($X.getPassword())
      - pattern: $LOGGER.error($X.getEmail())
      - pattern: $LOGGER.error($X.getPassword())
      - pattern: System.out.println($X.getEmail())
      - pattern: System.out.println($X.getPhone())
      - pattern: System.out.println($X.getSsn())
      - pattern: System.out.println($X.getPassword())

  - id: pii-in-logs-csharp
    languages: [csharp]
    severity: WARNING
    message: |
      Potential PII in log statement. Logging properties like Email, Phone, Ssn, or Password in a
      string interpolation or format string may leak personal information into log streams. Use a
      structured logging library with destructuring and field-level redaction (e.g., Serilog).
    metadata:
      category: "compliance"
      cwe: "CWE-532"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insertion_of_Sensitive_Information_into_Log_File"
      controls:
        - "CA-PIPEDA-007"
        - "EU-GDPR-014"
        - "CA-QC-LAW25-016"
        - "US-CA-CCPA-011"
        - "CA-AB-PIPA-006"
        - "CA-BC-PIPA-006"
      confidence: "baseline"
    pattern-either:
      - pattern: $LOGGER.LogInformation($"...{$X.Email}...")
      - pattern: $LOGGER.LogInformation($"...{$X.Phone}...")
      - pattern: $LOGGER.LogInformation($"...{$X.Ssn}...")
      - pattern: $LOGGER.LogInformation($"...{$X.Password}...")
      - pattern: $LOGGER.LogDebug($"...{$X.Email}...")
      - pattern: $LOGGER.LogDebug($"...{$X.Phone}...")
      - pattern: $LOGGER.LogDebug($"...{$X.Password}...")
      - pattern: $LOGGER.LogWarning($"...{$X.Email}...")
      - pattern: $LOGGER.LogWarning($"...{$X.Password}...")
      - pattern: $LOGGER.LogError($"...{$X.Email}...")
      - pattern: $LOGGER.LogError($"...{$X.Password}...")
      - pattern: Console.WriteLine($"...{$X.Email}...")
      - pattern: Console.WriteLine($"...{$X.Phone}...")
      - pattern: Console.WriteLine($"...{$X.Ssn}...")
      - pattern: Console.WriteLine($"...{$X.Password}...")
