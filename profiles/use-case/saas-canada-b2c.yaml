  metadata:
    title: "Use-Case Profile — SaaS Canada B2C (PIPEDA + Quebec Law 25 + CASL + PIPA-AB + PIPA-BC + PHIPA-ON)"
    last-modified: "2026-05-10T00:00:00Z"
    version: "0.1.2"
    oscal-version: "1.0.2"
    props:
      - name: "use-case"
        value: "saas-canada-b2c"
      - name: "description"
        value: >
          For SaaS products serving Canadian consumers across all provinces; covers federal baseline
          (PIPEDA + CASL) plus Quebec Law 25, Alberta PIPA, and BC PIPA provincial obligations.
          Also includes Ontario PHIPA for SaaS products that process personal health information
          on behalf of Ontario health information custodians (HICs), and provincial PHIA placeholders
          for MB, SK, NL, and NS (community-tier; authored when RFC closes).
