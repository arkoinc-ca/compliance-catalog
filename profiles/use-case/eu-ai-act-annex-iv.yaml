    oscal-version: "1.0.2"
    props:
      - name: "use-case"
        value: "eu-ai-act-annex-iv"
      - name: "description"
        value: >
          For providers of high-risk AI systems preparing Annex IV technical documentation.
          Covers system overview, design and architecture, data governance, monitoring plan,
          performance metrics, change management, and the EU declaration of conformity.
          Scoped to the controls that directly drive documentation obligations under Art. 9-15
          and Art. 47, excluding deployer-only (Art. 26-27) and prohibition (Art. 5) controls.
      - name: "target-audience"
        value: "AI system providers building Annex IV documentation packages for high-risk AI systems"
