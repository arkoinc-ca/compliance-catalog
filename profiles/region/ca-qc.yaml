  metadata:
    title: "Canada — Quebec Region Profile (Quebec Law 25 + PIPEDA + CASL)"
    last-modified: "2026-05-10T00:00:00Z"
    version: "0.1.2"
    oscal-version: "1.0.2"
    props:
      - name: "non-applicability-note"
        value: >-
          Quebec has been declared substantially similar to PIPEDA for intra-provincial commercial
          activity (OIC P.C. 2003-1842). PIPEDA is included here because it continues to apply in
          Quebec to: (a) federal works and undertakings; (b) inter-provincial trade and commerce;
          and (c) cross-border transfers of personal information. Organisations operating exclusively
          within Quebec's private sector for intra-provincial purposes may be governed solely by
          Quebec Law 25, but SaaS or multi-jurisdictional products should assess PIPEDA applicability
          on all three residual grounds before excluding it from their compliance scope.
