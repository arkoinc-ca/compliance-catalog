  metadata:
    title: "Canada — British Columbia Region Profile (PIPA-BC + PIPEDA + CASL)"
    last-modified: "2026-05-10T00:00:00Z"
    version: "0.1.2"
    oscal-version: "1.0.2"
    props:
      - name: "non-applicability-note"
        value: >-
          British Columbia has been declared substantially similar to PIPEDA for intra-provincial
          private-sector commercial activity (OIC P.C. 2004-1608). PIPEDA is included here because
          it continues to apply in BC to: (a) federal works and undertakings; (b) inter-provincial
          trade and commerce; and (c) cross-border transfers of personal information. Organisations
          operating exclusively within BC's private sector for intra-provincial purposes may be
          governed solely by PIPA-BC, but SaaS or multi-jurisdictional products should assess PIPEDA
          applicability on all three residual grounds before excluding it from their compliance scope.
