    props:
      - name: "authoring-note"
        value: |
          The UK GDPR catalog covers UK-specific divergences. The retained EU GDPR
          obligations (Chapter II–V) remain applicable in UK law via the UK GDPR as defined
          in the Data Protection Act 2018 s.3. Both imports are required for a complete
          UK compliance baseline.
