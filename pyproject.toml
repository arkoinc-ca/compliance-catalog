[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-catalog"
version = "0.0.1-skeleton"
description = "OSCAL-shaped compliance control catalog for CA/US/EU privacy and AI-governance regulations"
requires-python = ">=3.11"
dependencies = [
    "compliance-trestle>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
