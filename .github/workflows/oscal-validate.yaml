name: OSCAL Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oscal-validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oscal-validate:
    name: OSCAL Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2  # TODO(P0-08): verify SHA

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0  # TODO(P0-08): verify SHA
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pydantic pytest ruff mypy types-PyYAML

      - name: Lint
        run: python -m ruff check scripts/ tests/

      - name: Type check
        run: python -m mypy scripts/

      - name: Run custom catalog validator
        run: python scripts/validate_catalog.py

      - name: Run catalog test suite
        run: pytest tests/test_catalog_validation.py -v
