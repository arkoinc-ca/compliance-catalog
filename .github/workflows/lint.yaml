name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2  # TODO(P0-08): verify SHA — H-27

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
