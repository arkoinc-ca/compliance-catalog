      controls:
        - id: "CN-PIPL-001"
          title: "PLACEHOLDER — PIPL personal information processing obligations [OUT-OF-SCOPE-FOR-V1]"
          props:
            - name: "status"
              value: "skeleton"
            - name: "placeholder-reason"
              value: >-
                Cross-border transfer obligations and CAC certification regime require
                regional legal partnership; out of scope for v1.
          parts:
            - id: "CN-PIPL-001-stmt"
              name: "statement"
              prose: >-
                PIPL (effective 2021-11-01) establishes a comprehensive framework for
                processing personal information of individuals in China, including lawful
                basis requirements, purpose limitation, consent obligations, and
                restrictions on cross-border transfers. Organisations transferring personal
                information outside China must pass a CAC security assessment, conclude a
                standard contract, or obtain a personal information protection certification.
                TODO: Author full control set once regional legal partnership is established.
                Monitor https://www.cac.gov.cn/ for implementing regulations.
