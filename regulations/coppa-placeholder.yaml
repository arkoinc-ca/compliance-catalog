  metadata:
    title: "Children's Online Privacy Protection Act [PLACEHOLDER — OUT-OF-SCOPE-FOR-V1]"
    last-modified: "2026-05-10T00:00:00Z"
    version: "0.0.1-skeleton"
    oscal-version: "1.0.2"
    props:
      - name: "regulation-short-code"
        value: "US-COPPA"
      - name: "jurisdiction"
        value: "US"
      - name: "effective-as-of"
        value: "2000-04-21"
      - name: "source-citation"
        value: "https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa"
      - name: "status"
        value: "out-of-scope-for-v1"
      - name: "placeholder-reason"
        value: >-
          COPPA's age-gating and parental-consent flows require domain-specific runtime
          detection beyond static analysis. Accurately detecting under-13 user handling
          in application code demands runtime context (session state, UI rendering) that
          the current semgrep-based static engine cannot provide reliably; scheduled for
          a future runtime-detection catalog extension.
  groups:
    - id: "coppa-placeholder-group"
      title: "PLACEHOLDER — OUT-OF-SCOPE-FOR-V1 — Controls to be authored in a future runtime-detection catalog extension"
      controls:
        - id: "US-COPPA-001"
          title: "PLACEHOLDER — COPPA verifiable parental consent and data minimisation for children [OUT-OF-SCOPE-FOR-V1]"
          props:
            - name: "status"
              value: "skeleton"
            - name: "placeholder-reason"
              value: >-
                Age-gating and parental-consent flows require domain-specific runtime
                detection beyond static analysis; out of scope for v1.
          parts:
            - id: "US-COPPA-001-stmt"
              name: "statement"
              prose: >-
                COPPA (15 U.S.C. §§ 6501-6506) prohibits operators of websites or online
                services directed to children under 13 from collecting, using, or disclosing
                personal information without verifiable parental consent. Operators must
                provide a clear privacy notice, obtain verifiable parental consent prior to
                collection, and honour parental requests to review or delete their child's
                information. TODO: Author full control set once runtime-detection extension
                is scoped. See https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa
