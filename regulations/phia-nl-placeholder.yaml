              prose: |
                Provincial health-info statute — to be authored via RFC process. The Newfoundland and Labrador
                Personal Health Information Act (SNL 2008, c P-7.01) governs the collection, use, disclosure,
                and protection of personal health information by custodians in Newfoundland and Labrador. Full
                control authoring is pending SME review and the RFC contribution process.
