      controls:
        - id: "EU-DORA-001"
          title: "PLACEHOLDER — DORA ICT risk management and digital operational resilience [OUT-OF-SCOPE-FOR-V1]"
          props:
            - name: "status"
              value: "skeleton"
            - name: "placeholder-reason"
              value: >-
                Financial-sector ICT risk regulation; in force 2025-01-17 but
                sector-specific; out of scope for v1 general data-protection catalog.
          parts:
            - id: "EU-DORA-001-stmt"
              name: "statement"
              prose: >-
                DORA (Regulation (EU) 2022/2554, applicable from 17 January 2025) requires
                financial entities to maintain robust ICT risk management frameworks,
                classify and report major ICT-related incidents to competent authorities,
                conduct digital operational resilience testing, and manage ICT third-party
                concentration risk. Critical ICT third-party service providers are subject
                to direct oversight by European Supervisory Authorities (EBA, EIOPA, ESMA).
