      - name: "placeholder-reason"
        value: >-
          DORA is a financial-sector ICT risk regulation applicable to financial entities
          (credit institutions, investment firms, insurance undertakings, crypto-asset
          service providers, etc.) and their critical ICT third-party service providers.
          The regulation came into force 2025-01-17. Its sector-specific scope falls
          outside the general-purpose data-protection focus of compliance-catalog v1;
          scheduled for a future financial-sector catalog extension.
