          parts:
            - id: "US-TX-TDPSA-001_smt"
              name: "statement"
              prose: |
                Community tier — to be authored via RFC process per CONTRIBUTING.md. This placeholder
                reserves the control ID namespace for the Texas Data Privacy and Security Act (Tex. Bus. &
                Com. Code §541 et seq., effective July 1, 2024). Full controls will be authored by the
                community following the RFC process described in CONTRIBUTING.md.
            - id: "US-TX-TDPSA-001_gdn"
              name: "guidance"
              prose: |
                See CONTRIBUTING.md for instructions on authoring community-tier regulation controls and
                submitting them via the RFC process. Prospective authors should review the existing VCDPA
                and CTDPA catalogs as style references.
