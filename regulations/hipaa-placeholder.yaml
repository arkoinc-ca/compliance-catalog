      controls:
        - id: "US-HIPAA-001"
          title: "PLACEHOLDER — HIPAA Privacy Rule and Security Rule obligations [OUT-OF-SCOPE-FOR-V1]"
          props:
            - name: "status"
              value: "skeleton"
            - name: "placeholder-reason"
              value: >-
                HIPAA covered-entity coverage requires sectoral scoping outside the
                current PII-focus of compliance-catalog v1.
          parts:
            - id: "US-HIPAA-001-stmt"
              name: "statement"
              prose: >-
                HIPAA (Pub. L. 104-191) requires covered entities and their business
                associates to protect the privacy and security of individually identifiable
                health information (Protected Health Information, PHI). The Privacy Rule
                (45 CFR Part 164, Subpart E) establishes permitted uses and disclosures
                of PHI; the Security Rule (45 CFR Part 164, Subpart C) requires
                administrative, physical, and technical safeguards for electronic PHI.
                TODO: Author full control set once health-sector catalog extension is
                scoped. See https://www.hhs.gov/hipaa/for-professionals/index.html
