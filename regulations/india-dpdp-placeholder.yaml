      controls:
        - id: "IN-DPDP-001"
          title: "PLACEHOLDER — India DPDP data fiduciary obligations [OUT-OF-SCOPE-FOR-V1]"
          props:
            - name: "status"
              value: "skeleton"
            - name: "placeholder-reason"
              value: >-
                Data Protection Board of India rules pending; effective date conditional
                on Section 1 commencement notification.
          parts:
            - id: "IN-DPDP-001-stmt"
              name: "statement"
              prose: >-
                The Digital Personal Data Protection Act 2023 (No. 22 of 2023) establishes
                obligations for Data Fiduciaries processing personal data of individuals in
                India, including consent requirements, purpose limitation, data minimisation,
                data accuracy, storage limitation, and security safeguards. Significant data
                fiduciaries face additional obligations including appointment of a Data
                Protection Officer and periodic Data Protection Impact Assessments.
                TODO: Author full control set once commencement notification is issued.
