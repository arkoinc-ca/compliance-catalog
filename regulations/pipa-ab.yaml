catalog:
  uuid: "a1b2c3d4-0003-4000-8000-100000000003"
  metadata:
    title: "Personal Information Protection Act (Alberta PIPA)"
    last-modified: "2026-05-09T00:00:00Z"
    version: "0.1.0"
    oscal-version: "1.0.2"
    props:
      - name: "regulation-short-code"
        value: "PIPA-AB"
      - name: "jurisdiction"
        value: "CA-AB"
      - name: "effective-as-of"
        value: "2004-01-01"
      - name: "source-citation"
        value: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
  groups:
    - id: "pipa-ab-collection-and-consent"
      title: "Collection, Use, Disclosure, and Consent (Part 2, §7–22)"
      controls:
        - id: "CA-AB-PIPA-001"
          uuid: "a1b2c3d4-0201-4000-8000-100000000201"
          title: "Notification at or Before Collection — disclose purposes and contact for inquiries"
          props:
            - name: "source-section"
              value: "§13"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-001_smt"
              name: "statement"
              prose: |
                Before or at the time an organization collects personal information about an individual,
                the organization must provide the individual with the purposes for which the information is
                being collected and the name or title and contact information of a person who can answer
                the individual's questions about the collection. Where it is not practical to notify
                individuals at or before collection, notice must be given as soon as reasonably practicable.
            - id: "CA-AB-PIPA-001_gdn"
              name: "guidance"
              prose: |
                Embed a collection notice at or immediately before every data-collection point — web forms,
                phone intake scripts, paper forms, and point-of-sale interactions. The notice must name an
                actual contact (title or name) and include a working email address or phone number. Generic
                references to a privacy policy URL without contact information do not satisfy §13. The OIPC
                Alberta has found deficient notices in orders P2011-003 and P2016-016 where organizations
                relied on fine-print disclosures remote from the collection point.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"

        - id: "CA-AB-PIPA-002"
          uuid: "a1b2c3d4-0202-4000-8000-100000000202"
          title: "Consent — Obtain consent for collection, use, and disclosure of personal information"
          props:
            - name: "source-section"
              value: "§7, §8"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-002_smt"
              name: "statement"
              prose: |
                An organization must not collect, use, or disclose personal information about an individual
                without the consent of the individual, except as authorized or required by this Act or
                another enactment of Alberta or Canada. Consent may be express or implied, and must be
                meaningful — the individual must understand what they are consenting to and the consequences
                of withholding or withdrawing consent.
            - id: "CA-AB-PIPA-002_gdn"
              name: "guidance"
              prose: |
                Implied consent is appropriate for routine, low-sensitivity collection where a reasonable
                person would expect it (e.g., collecting a mailing address to fulfill a purchase). Express
                consent — obtained by a clear affirmative act — is required for sensitive information or
                secondary uses the individual would not reasonably anticipate. Document consent records
                with timestamps and the notice version shown. The OIPC Alberta's guidance note on consent
                (updated 2018) and Order P2019-05 clarify that bundled consent for unrelated purposes
                does not meet the meaningfulness standard.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"

        - id: "CA-AB-PIPA-003"
          uuid: "a1b2c3d4-0203-4000-8000-100000000203"
          title: "Employee Personal Information — Reasonable purposes; notice to employees"
          props:
            - name: "source-section"
              value: "§15, §16, §18, §21"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-003_smt"
              name: "statement"
              prose: |
                Alberta PIPA creates a distinct framework for employee personal information: an employer
                may collect, use, and disclose employee personal information without consent if it is
                collected for a purpose that is reasonable, and the employer notifies the employee of those
                purposes before or at the time of collection. An employer may disclose employee personal
                information to a third party without consent only for the purposes for which it was
                collected or for a consistent purpose.
            - id: "CA-AB-PIPA-003_gdn"
              name: "guidance"
              prose: |
                Provide employees with a written privacy notice at or before the start of employment
                describing all purposes for which their personal information will be collected, used,
                and disclosed — including payroll processing, benefits administration, performance
                management, and any workplace monitoring. The reasonableness test under §15 is assessed
                objectively; surveillance practices (keystroke logging, location tracking) require
                documented justification. The OIPC Alberta's guidance on employee information (2017)
                recommends annual re-notification when purposes change.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"

        - id: "CA-AB-PIPA-004"
          uuid: "a1b2c3d4-0204-4000-8000-100000000204"
          title: "Disclosure Without Consent — Limit disclosures to listed circumstances; document basis"
          props:
            - name: "source-section"
              value: "§20"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-004_smt"
              name: "statement"
              prose: |
                An organization may disclose personal information about an individual without their consent
                only in circumstances enumerated in §20 of Alberta PIPA, including: compliance with a
                subpoena or court order; reasonable grounds to believe it is in the individual's interest
                and consent cannot be obtained in a timely way; or for contacting next of kin in an
                emergency. Organizations must document the specific §20 ground relied upon for each
                non-consensual disclosure.
            - id: "CA-AB-PIPA-004_gdn"
              name: "guidance"
              prose: |
                Establish an internal disclosure-authorization procedure: any non-consensual disclosure
                must be reviewed and approved by the privacy officer before release, and the applicable
                §20 exception must be recorded in a disclosure log. Requests from law enforcement must be
                accompanied by lawful authority (warrant, court order, or a statutory disclosure provision)
                unless an emergency exists. The OIPC Alberta has repeatedly cautioned organizations against
                voluntary disclosure to police without proper authority (see OIPC orders P2012-007 and
                P2014-002).
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"

    - id: "pipa-ab-rights-and-safeguards"
      title: "Access, Correction, Safeguards, and Breach Notification"
      controls:
        - id: "CA-AB-PIPA-005"
          uuid: "a1b2c3d4-0205-4000-8000-100000000205"
          title: "Right of Access and Correction — Respond within 45 days; explain refusals"
          props:
            - name: "source-section"
              value: "§24, §25"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-005_smt"
              name: "statement"
              prose: |
                Upon written request, an organization must inform an individual whether it holds personal
                information about them, provide access to that information, and provide the names of any
                organizations to which the information has been disclosed. The organization must respond
                within 45 days or, if an extension is required, notify the individual within 45 days of
                the extended deadline and the reasons for the extension. Where the organization corrects
                personal information, it must notify any organizations to which the incorrect information
                was previously disclosed.
            - id: "CA-AB-PIPA-005_gdn"
              name: "guidance"
              prose: |
                Alberta's 45-day response window is longer than BC PIPA's 30 business-day window and
                Quebec's 30-day window — this is a provincial nuance to track when multi-jurisdiction
                obligations apply. An extension of up to an additional 30 days is permitted where the
                request is large, consultation is required, or the 45-day limit would unreasonably
                interfere with operations. Refusals must state the specific ground under §24(4) and
                inform the individual of their right to make a complaint to the OIPC Alberta. Implement
                an access-request intake process with a logged 45-day deadline tracker.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"

        - id: "CA-AB-PIPA-006"
          uuid: "a1b2c3d4-0206-4000-8000-100000000206"
          title: "Reasonable Security Arrangements — Protect personal information against loss/unauthorized access"
          props:
            - name: "source-section"
              value: "§34"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-006_smt"
              name: "statement"
              prose: |
                An organization must protect personal information that is in its custody or under its
                control by making reasonable security arrangements against such risks as unauthorized
                access, collection, use, disclosure, copying, modification, or disposal of the
                information. The security arrangements must be appropriate to the sensitivity of the
                information.
            - id: "CA-AB-PIPA-006_gdn"
              name: "guidance"
              prose: |
                Security arrangements are assessed against a proportionality standard: more sensitive
                information (health records, financial data, SIN) requires stronger controls. Document
                your information security framework referencing recognized standards (ISO 27001, SOC 2,
                NIST CSF). Minimum controls include: access controls and least-privilege principles;
                encryption for data at rest and in transit; audit logging; vulnerability management;
                and physical security for paper records. The OIPC Alberta's published breach decisions
                (e.g., P2019-ND-002) consistently cite absence of encryption and poor access controls
                as failures of §34.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"

        - id: "CA-AB-PIPA-007"
          uuid: "a1b2c3d4-0207-4000-8000-100000000207"
          title: "Breach Notification — Notify Commissioner without unreasonable delay where real risk of significant harm"
          props:
            - name: "source-section"
              value: "§34.1"
            - name: "effective-date"
              value: "2010-05-01"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-007_smt"
              name: "statement"
              prose: |
                Alberta was the first Canadian province to enact statutory breach notification: if an
                organization has reasonable grounds to believe that a breach of its security arrangements
                has occurred and there exists a real risk of significant harm to the individuals whose
                information was involved, the organization must notify the Office of the Information and
                Privacy Commissioner of Alberta (OIPC AB) and the affected individuals without
                unreasonable delay. Notification to individuals must include sufficient information to
                allow them to take steps to protect themselves.
            - id: "CA-AB-PIPA-007_gdn"
              name: "guidance"
              prose: |
                "Real risk of significant harm" is assessed against factors including the sensitivity of
                the information, the number of individuals affected, and the likelihood of misuse.
                Notify the OIPC AB using its online breach-notification form as soon as the assessment
                is complete — the OIPC AB has stated that delays beyond a few days without justification
                are unreasonable. Individual notifications must identify the nature of the breach,
                categories of information involved, and protective steps the individual can take.
                Maintain a breach log of all incidents evaluated, whether or not the notification
                threshold was met, as the OIPC AB may audit breach assessment decisions.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"
            - href: "https://oipc.ab.ca/"
              rel: source
              text: "Office of the Information and Privacy Commissioner of Alberta — breach notification guidance"

        - id: "CA-AB-PIPA-008"
          uuid: "a1b2c3d4-0208-4000-8000-100000000208"
          title: "Privacy Officer / Designation — Designate one or more individuals responsible for compliance"
          props:
            - name: "source-section"
              value: "§5(3)"
            - name: "effective-date"
              value: "2004-01-01"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "CA-AB"
            - name: "status"
              value: "draft"
          parts:
            - id: "CA-AB-PIPA-008_smt"
              name: "statement"
              prose: |
                Every organization subject to Alberta PIPA must designate one or more individuals to be
                responsible for ensuring compliance with the Act. The organization remains accountable
                for compliance and any transfer of personal information to a third party does not reduce
                the organization's obligations under the Act. The designation must be documented and the
                designated individual must be reachable for inquiries.
            - id: "CA-AB-PIPA-008_gdn"
              name: "guidance"
              prose: |
                The designation under §5(3) parallels PIPEDA's Principle 1 (Accountability) and BC
                PIPA §4(3) but is expressly stated in the Act rather than regulations. Publish the
                designated contact's title (not necessarily their personal name) and a functional contact
                method on the organization's website and in its privacy notice. Ensure the designate
                has authority to make compliance decisions and receives regular training. The OIPC
                Alberta recommends the designate also oversee the breach notification program and respond
                to OIPC inquiries within the required timelines.
          links:
            - href: "https://kings-printer.alberta.ca/1266.cfm?page=p06p5.cfm"
              rel: source
              text: "Personal Information Protection Act, SA 2003, c P-6.5 (Alberta King's Printer)"
            - href: "https://oipc.ab.ca/"
              rel: source
              text: "Office of the Information and Privacy Commissioner of Alberta"
