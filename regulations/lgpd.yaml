catalog:
  uuid: "a1b2c3d4-c100-4000-8000-100000000000"
  metadata:
    title: "Lei Geral de Proteção de Dados Pessoais (LGPD) — Lei nº 13.709/2018"
    last-modified: "2026-05-10T00:00:00Z"
    version: "0.1.1"
    oscal-version: "1.0.2"
    props:
      - name: "regulation-short-code"
        value: "BR-LGPD"
      - name: "jurisdiction"
        value: "BR"
      - name: "effective-as-of"
        value: "2020-09-18"
      - name: "sanctions-effective"
        value: "2021-08-01"
      - name: "source-citation"
        value: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
      - name: "regulator"
        value: "Autoridade Nacional de Proteção de Dados (ANPD)"
      - name: "regulator-url"
        value: "https://www.gov.br/anpd/pt-br"
  groups:
    - id: "lgpd-legal-bases"
      title: "Legal Bases for Processing"
      controls:
        - id: "BR-LGPD-001"
          uuid: "a1b2c3d4-c101-4000-8000-100000000001"
          title: "Establish and document a lawful basis for processing personal data (Art. 7)"
          props:
            - name: "source-section"
              value: "Art. 7"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-001_smt"
              name: "statement"
              prose: |
                Processing of personal data is only permitted when it is based on one of the legal hypotheses
                listed in Art. 7 of the LGPD, including: consent of the data subject; compliance with a legal
                or regulatory obligation; execution of public policies; conducting studies by research bodies;
                execution of a contract; exercise of rights in judicial, administrative, or arbitral proceedings;
                protection of life; protection of health; legitimate interests of the controller or a third party;
                and credit protection. The controller must be able to demonstrate the applicable legal basis.
            - id: "BR-LGPD-001_gdn"
              name: "guidance"
              prose: |
                Before initiating any processing activity, identify and document the applicable Art. 7 basis in
                your records of processing activities (ROPA). Consent under LGPD must be free, informed, unambiguous,
                and for a specific purpose; it cannot be bundled with acceptance of general terms. Legitimate
                interest (Art. 7 IX) requires a three-part test: purpose, necessity, and balancing against data
                subject rights. Document your legitimate interest assessment (LIA) and retain it. Review legal
                bases periodically and update when processing purposes change.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

        - id: "BR-LGPD-002"
          uuid: "a1b2c3d4-c102-4000-8000-100000000002"
          title: "Establish lawful basis for processing sensitive personal data (Art. 11)"
          props:
            - name: "source-section"
              value: "Art. 11"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-002_smt"
              name: "statement"
              prose: |
                Sensitive personal data — comprising racial or ethnic origin, religious belief, political opinion,
                trade union or religious organization membership, health or sex life data, genetic or biometric
                data — may only be processed with explicit consent of the data subject for specific purposes, or
                without consent only under the narrower list of bases set out in Art. 11 II (legal obligation,
                public policy studies, vital interests, prevention of fraud, or protection of health by health
                professionals). Processing sensitive data for discriminatory or abusive purposes is prohibited.
            - id: "BR-LGPD-002_gdn"
              name: "guidance"
              prose: |
                Maintain a separate register of all processing activities involving sensitive data with the
                applicable Art. 11 basis documented. Explicit consent for sensitive data must name the specific
                category of data and specific purpose — generic privacy policy consent is insufficient. For health
                data processing without consent (e.g., Art. 11 II f), ensure only the minimum necessary data is
                processed and that access is restricted to qualified health professionals bound by professional
                secrecy. Conduct a DPIA/RIPD for all sensitive data processing activities.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-data-subject-rights"
      title: "Data Subject Rights"
      controls:
        - id: "BR-LGPD-003"
          uuid: "a1b2c3d4-c103-4000-8000-100000000003"
          title: "Honor data subject rights upon request (Art. 18)"
          props:
            - name: "source-section"
              value: "Art. 18"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-003_smt"
              name: "statement"
              prose: |
                The data subject has the right to obtain from the controller, at any time and upon request:
                confirmation of the existence of processing; access to data; correction of incomplete, inaccurate,
                or outdated data; anonymization, blocking, or deletion of unnecessary or excessive data; portability
                to another service or product provider; deletion of data processed with consent; information about
                public and private entities with which data was shared; information about the possibility of not
                providing consent and the consequences; and revocation of consent. The controller must respond
                within 15 days.
            - id: "BR-LGPD-003_gdn"
              name: "guidance"
              prose: |
                Establish an accessible channel (web form, email, or in-app) for data subject requests and
                respond within the 15-day statutory window. Document each request, the response, and any grounds
                for refusal. Deletion requests must be actioned immediately unless a legal retention obligation
                applies; document such exceptions. For portability requests, provide data in a structured,
                interoperable format. Train customer-facing staff to route LGPD requests to the DPO/encarregado
                without delay.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-dpo"
      title: "Data Protection Officer (Encarregado)"
      controls:
        - id: "BR-LGPD-004"
          uuid: "a1b2c3d4-c104-4000-8000-100000000004"
          title: "Appoint and publish contact details of the DPO/encarregado (Art. 41)"
          props:
            - name: "source-section"
              value: "Art. 41"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-004_smt"
              name: "statement"
              prose: |
                The controller must appoint an encarregado (data protection officer) responsible for: accepting
                complaints and communications from data subjects; receiving communications from the ANPD; guiding
                employees and contractors on data protection practices; and carrying out other responsibilities
                set by the controller or supplementary rules. The encarregado's identity and contact details must
                be publicly disclosed, preferably on the controller's website.
            - id: "BR-LGPD-004_gdn"
              name: "guidance"
              prose: |
                Publish the encarregado's name (or title) and a direct contact method (email or form) on a
                publicly accessible page of your website. The encarregado may be an internal employee or an
                external service provider. Ensure the encarregado has adequate access to internal processes and
                data inventories to respond to ANPD inquiries. The ANPD may issue supplementary rules defining
                exemptions for micro- and small enterprises — monitor ANPD resolutions for applicable thresholds.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-dpia"
      title: "Data Protection Impact Assessment (RIPD)"
      controls:
        - id: "BR-LGPD-005"
          uuid: "a1b2c3d4-c105-4000-8000-100000000005"
          title: "Conduct a DPIA/RIPD for high-risk processing activities (Art. 38)"
          props:
            - name: "source-section"
              value: "Art. 38"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-005_smt"
              name: "statement"
              prose: |
                The ANPD may require the controller to prepare a data protection impact assessment report (relatório
                de impacto à proteção de dados pessoais — RIPD) for processing operations that may generate risks
                to civil liberties and fundamental rights. The report must contain: a description of the types
                of data collected; the methodology used for collection; the security measures adopted; and an
                analysis of measures, safeguards, and mechanisms to mitigate risks. The ANPD may determine that
                the content of the report be made public.
            - id: "BR-LGPD-005_gdn"
              name: "guidance"
              prose: |
                Proactively conduct a RIPD for any processing involving: sensitive data; large-scale profiling;
                systematic monitoring; processing of data of vulnerable individuals (including children); or new
                technologies that may pose risks to data subjects. The RIPD need not be published but must be
                available to the ANPD on request. Use the ANPD's published RIPD guidance as a reference template.
                Integrate RIPD into product development lifecycle gates for new processing activities.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-international-transfers"
      title: "International Data Transfers"
      controls:
        - id: "BR-LGPD-006"
          uuid: "a1b2c3d4-c106-4000-8000-100000000006"
          title: "Ensure adequate protection before transferring personal data internationally (Art. 33)"
          props:
            - name: "source-section"
              value: "Art. 33"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-006_smt"
              name: "statement"
              prose: |
                International transfer of personal data is only permitted to countries or international bodies
                that provide an adequate level of protection of personal data. Where adequacy is not established,
                transfer may proceed only where the controller provides and proves adequate safeguards through:
                standard contractual clauses; binding corporate rules; specific contractual clauses; global
                corporate privacy seals; or the data subject's specific and highlighted consent after being
                informed about the international nature of the transfer. The ANPD will determine which countries
                are deemed adequate.
            - id: "BR-LGPD-006_gdn"
              name: "guidance"
              prose: |
                Before initiating any cross-border transfer, verify whether the destination country holds an ANPD
                adequacy decision. Where no adequacy decision exists, execute standard contractual clauses
                approved or accepted by the ANPD, or binding corporate rules. Document each transfer basis in
                your records of processing. For transfers relying on consent, present the international transfer
                disclosure clearly and separately from other consent requests. Monitor ANPD resolutions for updates
                to adequacy determinations and approved transfer mechanisms.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-incident-notification"
      title: "Incident Notification"
      controls:
        - id: "BR-LGPD-007"
          uuid: "a1b2c3d4-c107-4000-8000-100000000007"
          title: "Notify the ANPD and affected data subjects of security incidents (Art. 48)"
          props:
            - name: "source-section"
              value: "Art. 48"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-007_smt"
              name: "statement"
              prose: |
                The controller must notify the ANPD and the affected data subject of any security incident that
                may pose a relevant risk or harm to the data subjects within a reasonable time period. The
                notification must include: the description of the nature of the affected personal data; information
                about the data subjects involved; the technical and security measures adopted; the risks related
                to the incident; and the measures that were or will be taken to reverse or mitigate the effects
                of the damage.
            - id: "BR-LGPD-007_gdn"
              name: "guidance"
              prose: |
                The ANPD's Resolution CD/ANPD No. 15/2024 sets the notification timeline at 72 hours for
                incidents posing relevant risk, and up to 3 business days for other notifiable incidents. Maintain
                an incident response plan that includes ANPD and data subject notification workflows. Establish
                a security incident register covering: date of occurrence; date of discovery; nature of data
                affected; number of data subjects; risk assessment; and remediation actions taken. Retain incident
                records for audit. Test the incident response plan at least annually.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-records-of-processing"
      title: "Records of Processing Activities"
      controls:
        - id: "BR-LGPD-008"
          uuid: "a1b2c3d4-c108-4000-8000-100000000008"
          title: "Maintain records of processing activities (Art. 37)"
          props:
            - name: "source-section"
              value: "Art. 37"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-008_smt"
              name: "statement"
              prose: |
                The controller and the operator must keep a record of the processing operations that they carry
                out, especially when based on the legitimate interest hypothesis. The ANPD may determine that
                records of specific categories of processing operations be made public, considering the nature,
                scope, context, and purpose of the processing as well as the risks and benefits for data subjects
                and third parties.
            - id: "BR-LGPD-008_gdn"
              name: "guidance"
              prose: |
                Maintain a Record of Processing Activities (ROPA) — equivalent to GDPR Art. 30 records — covering:
                controller and DPO contact details; purposes of processing; legal basis; categories of data subjects
                and personal data; recipients or categories of recipients; cross-border transfers and transfer
                mechanisms; retention periods; and a general description of technical and organizational security
                measures. Keep the ROPA current; review quarterly and after any material change to processing.
                The ROPA must be produced to the ANPD on request.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-children"
      title: "Children and Adolescents"
      controls:
        - id: "BR-LGPD-009"
          uuid: "a1b2c3d4-c109-4000-8000-100000000009"
          title: "Obtain specific parental consent before processing children's data (Art. 14)"
          props:
            - name: "source-section"
              value: "Art. 14"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-009_smt"
              name: "statement"
              prose: |
                Processing of personal data of children (under 12) must be in the best interests of the child
                and requires specific and highlighted consent from at least one parent or legal guardian. Processing
                of adolescents' data (12–18) should also be conducted in the best interests of the adolescent.
                Controllers must make reasonable efforts to verify that consent was given or authorized by a
                parent or guardian. Collection of more data than is strictly necessary for the service requested
                is prohibited, and conditioned processing that leads children to provide more data than necessary
                is also prohibited.
            - id: "BR-LGPD-009_gdn"
              name: "guidance"
              prose: |
                Implement age verification at the point of collection for services likely used by children under 12.
                When parental consent is collected, use a separate, clearly highlighted consent form that names
                the data, purpose, and identity of the controller. Do not use deceptive design patterns to obtain
                children's data. The ANPD may establish supplementary rules on age verification procedures and
                acceptable consent mechanisms for children's data. Conduct a RIPD for any service directed at
                or likely to be used by children.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-processor-obligations"
      title: "Processor (Operator) Obligations"
      controls:
        - id: "BR-LGPD-010"
          uuid: "a1b2c3d4-c110-4000-8000-100000000010"
          title: "Ensure operators process data only per controller instructions (Art. 39)"
          props:
            - name: "source-section"
              value: "Art. 39"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-010_smt"
              name: "statement"
              prose: |
                The operator (processor) must process personal data in accordance with the instructions provided
                by the controller, and the provisions of this Law apply to it when it violates the Law or does
                not follow the lawful instructions of the controller. The controller remains liable for the
                operator's processing where the operator does not comply with the LGPD.
            - id: "BR-LGPD-010_gdn"
              name: "guidance"
              prose: |
                Execute a written data processing agreement (DPA) with every operator/processor that processes
                personal data on your behalf. The DPA must restrict the operator to processing data solely on
                documented controller instructions; prohibit the operator from processing data for its own
                purposes; require the operator to implement adequate security measures; mandate breach notification
                to the controller without undue delay; and address return or deletion of data on contract
                termination. Audit key operators periodically for LGPD compliance. Maintain a register of all
                operators with DPA status and review dates.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

        - id: "BR-LGPD-011"
          uuid: "a1b2c3d4-c111-4000-8000-100000000011"
          title: "Implement technical and administrative security measures (Art. 46)"
          props:
            - name: "source-section"
              value: "Art. 46"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-011_smt"
              name: "statement"
              prose: |
                Agents of processing must adopt security, technical, and administrative measures capable of
                protecting personal data from unauthorized access and from accidental or unlawful destruction,
                loss, alteration, communication, or any form of improper or unlawful processing. The ANPD may
                establish technical security standards to govern controllers and operators.
            - id: "BR-LGPD-011_gdn"
              name: "guidance"
              prose: |
                Implement security controls proportionate to the risk level of processing activities, including:
                encryption at rest and in transit; access controls and least-privilege principles; audit logging;
                vulnerability management; and regular security testing. Document security measures in the RIPD
                for high-risk activities. Align with ANPD security guidelines and, where applicable, ABNT NBR
                ISO/IEC 27001 standards. Review and test security measures at least annually and after any
                significant infrastructure change.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

        - id: "BR-LGPD-012"
          uuid: "a1b2c3d4-c112-4000-8000-100000000012"
          title: "Apply data minimization and purpose limitation principles (Art. 6)"
          props:
            - name: "source-section"
              value: "Art. 6"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-012_smt"
              name: "statement"
              prose: |
                Processing of personal data must comply with good faith and with the principles of: purpose
                (processing for legitimate, specific, explicit, and informed purposes without possibility of
                further processing incompatible with those purposes); adequacy (compatibility of processing with
                the stated purposes); and necessity (limitation to the minimum necessary, relevant, and proportionate
                data to achieve the purposes). Excessive collection or secondary use incompatible with the original
                purpose is prohibited.
            - id: "BR-LGPD-012_gdn"
              name: "guidance"
              prose: |
                At design time, for each processing activity, define the specific, documented purpose and identify
                only the minimum data fields necessary. Do not retain data after the purpose is fulfilled. Before
                any new use of existing data, assess whether the new purpose is compatible with the original;
                if not, obtain a new legal basis or consent. Document purpose assessments in the ROPA. Implement
                data minimization controls in collection forms and APIs to prevent collection of unnecessary fields.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

        - id: "BR-LGPD-013"
          uuid: "a1b2c3d4-c113-4000-8000-100000000013"
          title: "Provide transparent privacy notice to data subjects (Art. 9)"
          props:
            - name: "source-section"
              value: "Art. 9"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-013_smt"
              name: "statement"
              prose: |
                The data subject has the right to access, at any time and upon request, information about: the
                specific purpose of the processing; the form and duration of the processing; the identity and
                contact information of the controller; information about shared use of data by the controller
                and the purpose; the controller's responsibilities; and data subject rights. This information
                must be provided in clear and adequate form, appropriate to the means used for collection.
            - id: "BR-LGPD-013_gdn"
              name: "guidance"
              prose: |
                Publish a privacy notice at or before the point of data collection. For digital products, embed
                a layered notice at the data entry point with a link to the full privacy policy. The notice must
                be written in plain language, appropriate to the audience (including children where applicable).
                Where the controller changes the purpose of processing, the data subject must be notified before
                the new processing begins, and may withdraw consent if the original basis was consent. Update
                the privacy notice promptly when processing activities change.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

        - id: "BR-LGPD-014"
          uuid: "a1b2c3d4-c114-4000-8000-100000000014"
          title: "Establish accountability governance and demonstrate compliance (Art. 50)"
          props:
            - name: "source-section"
              value: "Art. 50"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-014_smt"
              name: "statement"
              prose: |
                Controllers and operators may formulate rules of good practices and governance that establish
                conditions for organization, operation, procedure, including complaints and petitions of data
                subjects, security, technical standards, specific obligations for the different involved parties
                in the processing, educational actions, internal mechanisms of supervision and risk mitigation,
                and other conditions relevant to the processing of personal data. The ANPD shall encourage
                controllers and operators to adopt programs of good practices and governance.
            - id: "BR-LGPD-014_gdn"
              name: "guidance"
              prose: |
                Establish and document a formal LGPD compliance program covering: governance structure and roles;
                privacy by design principles in product development; employee training on LGPD obligations;
                internal audit procedures; a data subject request handling workflow; vendor management procedures;
                and an incident response plan. Document the program and demonstrate its operation to the ANPD
                when required. Compliance programs that are certified by ANPD-recognized bodies may be considered
                as mitigating factors in enforcement proceedings.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais"

    - id: "lgpd-supplementary-obligations"
      title: "Supplementary Obligations — Definitions, Consent, Legitimate Interest, Anonymization, Retention"
      controls:
        - id: "BR-LGPD-015"
          uuid: "a1b2c3d4-c115-4000-8000-100000000015"
          title: "Apply LGPD definitions to determine scope of personal data processing (Art. 5)"
          props:
            - name: "source-section"
              value: "Art. 5"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-015_smt"
              name: "statement"
              prose: |
                The LGPD applies to the processing of personal data — any information relating to an identified
                or identifiable natural person — as defined in Art. 5 I. Sensitive personal data (Art. 5 II)
                includes racial or ethnic origin, religious belief, political opinion, union membership, health
                or sex life, genetic or biometric data. Anonymous data (Art. 5 III) lies outside the LGPD
                scope when anonymization is irreversible; pseudonymous data (Art. 5 XI) remains subject to
                the LGPD. Controllers and operators must correctly classify data under these definitions before
                determining applicable obligations and legal bases.
            - id: "BR-LGPD-015_gdn"
              name: "guidance"
              prose: |
                Conduct a data classification exercise covering all personal data held or processed. For each
                dataset, determine: is it personal data (Art. 5 I)?; is it sensitive (Art. 5 II)?; is it
                truly anonymized or merely pseudonymized (Art. 5 III and XI)?. Anonymization must satisfy
                the Art. 12 technical standard — data that can be re-identified with reasonable effort remains
                personal data. Document classification outcomes in your ROPA. Misclassification of personal
                data as anonymous is a common compliance failure with significant enforcement risk.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 5 — Definitions"

        - id: "BR-LGPD-016"
          uuid: "a1b2c3d4-c116-4000-8000-100000000016"
          title: "Obtain valid consent — freely given, informed, unambiguous, and purpose-specific (Art. 8)"
          props:
            - name: "source-section"
              value: "Art. 8"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-016_smt"
              name: "statement"
              prose: |
                Consent under the LGPD must be provided in writing or by another means that demonstrates the
                data subject's free manifestation of will (Art. 8 caput). When consent is obtained in written
                form, it must be highlighted — clearly distinguishable from other clauses (Art. 8 §1). The
                burden of proof that consent was obtained falls on the controller (Art. 8 §2). Consent is
                deficient if it is too generic, and processing based on such consent is unlawful (Art. 8 §4).
                Consent may be revoked at any time without charge to the data subject (Art. 8 §5). Processing
                activities conducted before revocation remain lawful.
            - id: "BR-LGPD-016_gdn"
              name: "guidance"
              prose: |
                Design consent collection to be clearly separated from other contractual terms. Use purpose-
                specific consent checkboxes — do not bundle consent for multiple purposes in a single click.
                Maintain a consent audit trail capturing: the exact consent text displayed, the timestamp,
                the method of collection, and the unique identifier of the data subject. Implement a revocation
                mechanism accessible to the data subject at all times; immediately propagate revocation to all
                downstream systems. Audit consent records quarterly for completeness and legibility.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 8 — Consent requirements"

        - id: "BR-LGPD-017"
          uuid: "a1b2c3d4-c117-4000-8000-100000000017"
          title: "Document and justify legitimate interest as a lawful basis for processing (Art. 10)"
          props:
            - name: "source-section"
              value: "Art. 10"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-017_smt"
              name: "statement"
              prose: |
                Processing of personal data based on the controller's or third party's legitimate interest
                (Art. 7 IX / Art. 10) is permissible only for legitimate purposes, grounded in concrete
                situations, and when the data subject's fundamental rights and freedoms do not prevail.
                The controller must carry out an impact assessment on the data subject's rights and interests
                when processing based on legitimate interest (Art. 10 §3). The ANPD may request and the
                controller must provide evidence of the balancing test performed. Legitimate interest
                cannot be used to process sensitive personal data (Art. 11).
            - id: "BR-LGPD-017_gdn"
              name: "guidance"
              prose: |
                Complete a three-part legitimate interest assessment (LIA) for each processing activity
                relying on Art. 10: (1) purpose test — is the purpose legitimate and specific?; (2) necessity
                test — is processing necessary and proportionate to the purpose?; (3) balancing test — do
                the legitimate interests override the data subject's rights and freedoms? Document the
                assessment and retain it for the ANPD. Implement an opt-out mechanism for data subjects to
                object to processing based on legitimate interest (Art. 18 II). Review LIAs annually
                and whenever the underlying processing activity changes.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 10 — Legitimate interest"

        - id: "BR-LGPD-018"
          uuid: "a1b2c3d4-c118-4000-8000-100000000018"
          title: "Apply LGPD anonymization standards; treat pseudonymous data as personal data (Art. 12)"
          props:
            - name: "source-section"
              value: "Art. 12"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-018_smt"
              name: "statement"
              prose: |
                Anonymized data — data that cannot by any reasonable technical means be re-identified — is
                not considered personal data for LGPD purposes and is not subject to the Act (Art. 12 caput).
                However, where the process of anonymization can be reversed, or if the data can be used to
                identify the data subject, it is treated as personal data (Art. 12 §1). Pseudonymized data —
                where a reversible additional key is needed to re-identify — remains personal data subject
                to the full LGPD regime (Art. 12 §2). The ANPD may issue technical standards defining the
                conditions that constitute true anonymization.
            - id: "BR-LGPD-018_gdn"
              name: "guidance"
              prose: |
                Before treating any dataset as anonymized and outside LGPD scope, apply a re-identification
                risk assessment using the ANPD's technical standards once published, or established
                international benchmarks (NIST SP 800-188, ISO 29101). Document the assessment and
                the technical method applied (generalisation, suppression, noise addition, k-anonymity,
                differential privacy). Review anonymization assessments annually and whenever the dataset
                or the adversary context changes. Datasets shared with third parties should be subject
                to a fresh re-identification risk assessment before each transfer.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 12 — Anonymized and pseudonymized data"

        - id: "BR-LGPD-019"
          uuid: "a1b2c3d4-c119-4000-8000-100000000019"
          title: "Delete or anonymize personal data when the processing purpose is fulfilled (Art. 15)"
          props:
            - name: "source-section"
              value: "Art. 15"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "high"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-019_smt"
              name: "statement"
              prose: |
                The processing of personal data must end and the data must be deleted when: the processing
                purpose has been achieved or the data is no longer necessary for the purpose (Art. 15 I);
                the retention period has ended (Art. 15 II); the data subject has communicated revocation
                of consent (Art. 15 III); or the ANPD has determined the unlawfulness of the processing
                (Art. 15 IV). Data must be deleted in a format that cannot be recovered. The obligation
                to delete does not apply where retention is necessary to comply with a legal or regulatory
                obligation, for research by a public body, for transfer to a third party under the LGPD,
                or for exclusive use of the controller provided it is anonymized.
            - id: "BR-LGPD-019_gdn"
              name: "guidance"
              prose: |
                Implement retention schedules that automatically trigger deletion or anonymization when
                the retention period ends or the purpose is fulfilled. Document the legal basis for any
                data retained beyond the primary purpose (e.g., legal hold, regulatory obligation). For
                deletion requests from data subjects, implement the right to deletion under Art. 18 VI
                and propagate deletion requests to all processors and sub-processors. Evidence: retention
                schedule documentation, deletion execution logs, and legal hold register.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 15 — Termination of data processing"

        - id: "BR-LGPD-020"
          uuid: "a1b2c3d4-c120-4000-8000-100000000020"
          title: "Apply data subject rights on processing termination; delete or return data (Art. 16)"
          props:
            - name: "source-section"
              value: "Art. 16"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-020_smt"
              name: "statement"
              prose: |
                Upon termination of processing pursuant to Art. 15, personal data must be deleted (Art. 16 I),
                or retained for the exclusive use of the controller provided it is anonymized (Art. 16 II),
                or transferred to a third party that has complied with the LGPD (Art. 16 III), or retained by
                the controller or operator for compliance with a legal or regulatory obligation (Art. 16 IV).
                Where data is retained under Art. 16 II (anonymization), the anonymization must be technically
                irreversible. Where retained under Art. 16 IV, the controller must document the legal obligation
                and limit access to the retained data to the minimum necessary.
            - id: "BR-LGPD-020_gdn"
              name: "guidance"
              prose: |
                Map each retention scenario to the applicable Art. 16 basis at the time the processing
                termination trigger fires. For data retained under legal obligation (Art. 16 IV), create
                a legal hold register documenting: the specific legal or regulatory requirement; the
                categories of data retained; the retention duration; and the data access controls in place.
                For data retained in anonymized form (Art. 16 II), document the anonymization method and
                conduct a re-identification risk assessment per BR-LGPD-018.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 16 — Conservation of personal data"

        - id: "BR-LGPD-021"
          uuid: "a1b2c3d4-c121-4000-8000-100000000021"
          title: "Provide personal data portability to the data subject or another service provider (Art. 17)"
          props:
            - name: "source-section"
              value: "Art. 17"
            - name: "effective-date"
              value: "2020-09-18"
            - name: "severity"
              value: "medium"
            - name: "jurisdiction"
              value: "BR"
            - name: "status"
              value: "draft"
          parts:
            - id: "BR-LGPD-021_smt"
              name: "statement"
              prose: |
                Every natural person is entitled to the ownership of their personal data and to ensure the
                exercise of the rights specified in the LGPD in relation to them (Art. 17). The right to
                portability — providing a structured, interoperable copy of the data subject's personal data
                to another service provider — is an enumerated data subject right under Art. 18 V. The
                controller must provide data in a format that facilitates transfer to another controller,
                subject to ANPD regulation defining technical interoperability standards and any exceptions
                for industrial and commercial secrets.
            - id: "BR-LGPD-021_gdn"
              name: "guidance"
              prose: |
                Implement a portability export capability that produces personal data in a structured,
                machine-readable format (e.g., JSON or CSV). The portability right covers personal data
                provided by the data subject and processed with consent or under a contract. Data derived
                or inferred by the controller (e.g., risk scores, inferences) may be subject to different
                treatment — seek ANPD guidance on the scope of portability as regulations mature.
                Respond to portability requests within the 15-day window established for data subject
                rights responses under Art. 18. Document each portability request and its fulfilment.
          links:
            - href: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"
              rel: source
              text: "Lei nº 13.709/2018, Art. 17 — Ownership of personal data and Art. 18 V — Portability"
