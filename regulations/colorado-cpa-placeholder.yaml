          parts:
            - id: "US-CO-CPA-001_smt"
              name: "statement"
              prose: |
                Community tier — to be authored via RFC process per CONTRIBUTING.md. This placeholder
                reserves the control ID namespace for the Colorado Privacy Act (C.R.S. §6-1-1301 et seq.,
                effective July 1, 2023). Note: this catalog (CO-CPA) is distinct from the existing
                Colorado AI Act catalog (CO-AI-ACT), which covers C.R.S. §6-1-1701 et seq. Full controls
                will be authored by the community following the RFC process in CONTRIBUTING.md.
            - id: "US-CO-CPA-001_gdn"
              name: "guidance"
              prose: |
                See CONTRIBUTING.md for instructions on authoring community-tier regulation controls and
                submitting them via the RFC process. Prospective authors should review the existing VCDPA
                and CTDPA catalogs as style references. Do not conflate this catalog with CO-AI-ACT.
          links:
            - href: "https://leg.colorado.gov/bills/sb21-190"
              rel: source
              text: "Colorado SB 21-190 — Colorado Privacy Act"
