          title: "PLACEHOLDER — Australian Privacy Principles (APPs) obligations [OUT-OF-SCOPE-FOR-V1]"
          props:
            - name: "status"
              value: "skeleton"
            - name: "placeholder-reason"
              value: >-
                Privacy Act Review Tier 1+2 reforms tracked but not yet authored;
                out of scope for v1 catalog.
          parts:
            - id: "AU-PA-001-stmt"
              name: "statement"
              prose: >-
                The Privacy Act 1988 (Cth) and its Australian Privacy Principles (APPs)
                govern the collection, use, disclosure, and storage of personal information
                by Australian Government agencies and private-sector organisations with
                annual turnover exceeding AUD 3 million. The Privacy and Other Legislation
                Amendment Act 2024 introduced Tier 1 reforms including a new Children's
                Online Privacy Code framework and enhanced enforcement powers for the OAIC.
                TODO: Author full control set once Tier 1 and Tier 2 reforms are fully
                enacted. Monitor https://www.oaic.gov.au/privacy/privacy-act-review
