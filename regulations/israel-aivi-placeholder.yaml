          parts:
            - id: "IL-AIVI-001_smt"
              name: "statement"
              prose: |
                Non-binding — Ministry of Innovation, Science and Technology 2023 AI policy. To be re-evaluated
                when Israel passes binding AI legislation. As of 2026-05-09, Israel's AI governance framework
                consists of non-binding policy guidance issued by the Ministry of Innovation, Science and
                Technology. No dedicated AI statute is in force. The Privacy Protection Authority (PPA)
                enforces the Privacy Protection Law 5741-1981 and its regulations, which may apply to
                AI-driven data processing of Israeli citizens' personal information. Organisations should
                monitor legislative developments and PPA guidance for binding requirements.
            - id: "IL-AIVI-001_gdn"
              name: "guidance"
              prose: |
                This control is a placeholder pending enactment of binding Israeli AI legislation. Review this
                catalog entry when: (1) Israel enacts a binding AI Act or amends the Privacy Protection Law
                to address AI; (2) the PPA issues binding regulations on automated decision-making; or (3) the
                Israeli Standard Institution publishes mandatory AI standards. In the interim, apply general
                Privacy Protection Law obligations to AI-driven processing of Israeli personal data, and monitor
                the Ministry of Innovation's AI policy updates at gov.il.
