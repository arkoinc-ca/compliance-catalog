              prose: |
                Provincial health-info statute — to be authored via RFC process. The Saskatchewan Health
                Information Protection Act (SS 1999, c H-0.021) governs the collection, use, disclosure,
                and protection of personal health information by trustees in Saskatchewan. Full control
                authoring is pending SME review and the RFC contribution process.
