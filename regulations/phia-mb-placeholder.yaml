              prose: |
                Provincial health-info statute — to be authored via RFC process. The Manitoba Personal Health
                Information Act (C.C.S.M. c. P33.5) governs the collection, use, disclosure, and protection
                of personal health information by trustees (health information custodians) in Manitoba. Full
                control authoring is pending SME review and the RFC contribution process.
