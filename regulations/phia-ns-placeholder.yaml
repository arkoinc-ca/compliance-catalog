              prose: |
                Provincial health-info statute — to be authored via RFC process. The Nova Scotia Personal Health
                Information Act (SNS 2010, c 41) governs the collection, use, disclosure, and protection of
                personal health information by custodians in Nova Scotia. Full control authoring is pending
                SME review and the RFC contribution process.
